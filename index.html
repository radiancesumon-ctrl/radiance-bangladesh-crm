<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Radiance Bangladesh CRM</title>

<link
  rel="icon"
  href="../logo.png"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#1f2937;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#111827,#2563eb);
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:18px;
  padding:35px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.login-logo{
  display:block;
  width:110px;
  height:110px;
  object-fit:contain;
  margin:0 auto 15px;
}

.login-title{
  text-align:center;
  font-size:25px;
  font-weight:700;
  margin-bottom:5px;
}

.login-subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.form-control{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:11px 12px;
  outline:none;
  background:white;
}

.form-control:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

textarea.form-control{
  min-height:100px;
  resize:vertical;
}

.login-btn{
  width:100%;
  border:0;
  border-radius:8px;
  padding:12px;
  background:#2563eb;
  color:white;
  font-weight:700;
}

.login-btn:hover{
  background:#1d4ed8;
}

.login-error{
  color:#dc2626;
  background:#fee2e2;
  padding:10px;
  border-radius:7px;
  margin-bottom:15px;
  font-size:13px;
}


/* APP */

.app{
  display:flex;
  min-height:100vh;
}


/* SIDEBAR */

.sidebar{
  width:260px;
  background:#111827;
  color:white;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
  z-index:1000;
}

.brand{
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;
  align-items:center;
  gap:12px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
  background:white;
  border-radius:8px;
}

.brand-title{
  font-weight:700;
  font-size:17px;
}

.brand-subtitle{
  font-size:11px;
  color:#9ca3af;
  margin-top:2px;
}

.menu{
  padding:12px;
}

.menu-section{
  color:#6b7280;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  margin:16px 10px 7px;
}

.menu button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#d1d5db;
  padding:10px 12px;
  border-radius:7px;
  margin-bottom:2px;
}

.menu button:hover,
.menu button.active{
  background:#2563eb;
  color:white;
}


/* MAIN */

.main{
  margin-left:260px;
  width:calc(100% - 260px);
  min-height:100vh;
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.topbar-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.mobile-menu{
  display:none;
  border:0;
  background:#f3f4f6;
  border-radius:7px;
  padding:8px 12px;
}

.page-title{
  font-size:20px;
  font-weight:700;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-info{
  text-align:right;
}

.user-name{
  font-size:14px;
  font-weight:700;
}

.user-role{
  font-size:11px;
  color:#6b7280;
}

.logout-btn{
  border:0;
  background:#fee2e2;
  color:#dc2626;
  padding:8px 12px;
  border-radius:7px;
  font-weight:600;
}

.logout-btn:hover{
  background:#fecaca;
}

.content{
  padding:25px;
}


/* DASHBOARD */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  border-radius:12px;
  padding:20px;
  border:1px solid #e5e7eb;
}

.stat-label{
  color:#6b7280;
  font-size:13px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:700;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
}

.card-header{
  padding:17px 20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-title{
  font-weight:700;
}

.card-body{
  padding:20px;
}


/* MODULE */

.module-toolbar{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:15px;
  display:flex;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

.search{
  flex:1;
  padding:10px 12px;
  border:1px solid #d1d5db;
  border-radius:7px;
}

.btn{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  font-weight:600;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-secondary{
  background:#e5e7eb;
  color:#374151;
}

.btn-danger{
  background:#fee2e2;
  color:#dc2626;
}

.btn-success{
  background:#dcfce7;
  color:#15803d;
}

.table-card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  background:#f9fafb;
  text-align:left;
  font-size:12px;
  color:#6b7280;
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  white-space:nowrap;
}

td{
  padding:11px 12px;
  border-bottom:1px solid #f0f0f0;
  font-size:13px;
  vertical-align:top;
}

tr:hover td{
  background:#fafafa;
}

.actions{
  white-space:nowrap;
}

.action-btn{
  border:0;
  padding:6px 9px;
  border-radius:5px;
  font-size:12px;
  margin-right:4px;
}

.edit-btn{
  background:#dbeafe;
  color:#1d4ed8;
}

.delete-btn{
  background:#fee2e2;
  color:#dc2626;
}


/* BADGE */

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#e5e7eb;
  font-size:11px;
}

.badge.active,
.badge.paid,
.badge.completed{
  background:#dcfce7;
  color:#166534;
}

.badge.pending,
.badge.due{
  background:#fef3c7;
  color:#92400e;
}

.badge.inactive,
.badge.rejected,
.badge.cancelled{
  background:#fee2e2;
  color:#991b1b;
}


/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:2000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:850px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:14px;
}

.modal-header{
  padding:18px 20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-title{
  font-size:18px;
  font-weight:700;
}

.close-btn{
  border:0;
  background:#f3f4f6;
  width:32px;
  height:32px;
  border-radius:50%;
  font-size:18px;
}

.modal-body{
  padding:20px;
}

.modal-footer{
  padding:15px 20px;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}


/* REPORT */

.report-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.report-box{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:20px;
}

.report-box h4{
  color:#6b7280;
  font-size:12px;
  margin-bottom:8px;
}

.report-box strong{
  font-size:25px;
}


/* LOADING */

.loading{
  padding:40px;
  text-align:center;
  color:#6b7280;
}


/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:5000;
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  display:none;
  max-width:350px;
}

.toast.show{
  display:block;
}

.toast.error{
  background:#dc2626;
}

.toast.success{
  background:#15803d;
}


/* RESPONSIVE */

@media(max-width:1100px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .report-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .user-info{
    display:none;
  }

  .content{
    padding:15px;
  }

  .topbar{
    padding:0 15px;
  }
}

@media(max-width:500px){

  .stats,
  .report-grid{
    grid-template-columns:1fr;
  }

  .module-toolbar{
    flex-wrap:wrap;
  }

  .search{
    flex-basis:100%;
  }
}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <img
      src="../logo.png"
      class="login-logo"
      onerror="this.style.display='none'"

    <div class="login-title">

<!-- =====================================================

===================================================== -->

<div

  <!-- SIDEBAR -->

  <aside id="sidebar" class="sidebar">

    <div class="brand">

      <img
        src="../logo.png"

      >

      <button data-module="IELTS_Batches">📚 IELTS Batches</button>
      <button data-module="IELTS_Students">👨‍🎓 IELTS Students</button>
      <button data-module="IELTS_Attendance">📅 Attendance</button>
      <button data-module="IELTS_MockTests">📝 Mock Tests</button>
      <button data-module="IELTS_Results">📊 IELTS Results</button>


      <div class="menu-section">

      </div>

      </div>

      <button data-module="Payments">💰 Payments</button>
      <button data-module="Invoices">🧾 Invoices</button>
      <button data-module="MoneyReceipts">🧾 Money Receipts</button>
      <button data-module="Income">📈 Income</button>
      <button data-module="Expenses">📉 Expenses</button>

<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modalOverlay"
  class="modal-overlay"
>

        id="modalTitle"
        class="modal-title"

        Add Record

        class="close-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    <div
      id="modalBody"
      class="modal-body"
    ></div>

      <button
        class="btn btn-secondary"
        onclick="closeModal()"
      >
        Cancel

        Save
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>


/* =====================================================
   CONFIG
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxY1JlVa4vhxSQmJwI62WHHA_DkDXR2sYSYOr8thOtMqTMsH7oqsiEXUNMczh9zwW1Z/exec";


let currentUser = null;
let currentModule = "dashboard";
let currentRecords = [];
let currentEditRecord = null;
let dropdowns = {};


/* =====================================================
   MODULE NAMES
===================================================== */

const moduleNames = {

  dashboard:"Dashboard",

  Leads:"Leads",
  Students:"Students",
  Counselling:"Counselling",
  FollowUps:"Follow-ups",
  Tasks:"Tasks",

  IELTS_Batches:"IELTS Batches",
  IELTS_Students:"IELTS Students",
  IELTS_Attendance:"IELTS Attendance",
  IELTS_MockTests:"IELTS Mock Tests",
  IELTS_Results:"IELTS Results",

  Countries:"Countries",
  Universities:"Universities",
  Courses:"Courses",
  Intake:"Intake & Deadline",
  Applications:"Applications",
  Documents:"Documents",
  DocumentChecklist:"Document Checklist",
  Offers:"Offers",
  Visa:"Visa Management",

  Payments:"Payments",
  Invoices:"Invoices",
  MoneyReceipts:"Money Receipts",
  Income:"Income",
  Expenses:"Expenses",

  DuePayments:"Due Payments",
  Reports:"Reports",

  Users:"Staff Management",
  Roles:"Roles & Permissions",
  Notifications:"Notifications",
  Timeline:"Student Timeline",
  LeadSources:"Lead Sources",
  ActivityLog:"Activity Log",
  Settings:"Settings"
};


/* =====================================================
   INIT
===================================================== */

document.addEventListener("DOMContentLoaded", function(){

  document
    .querySelectorAll(".menu button[data-module]")
    .forEach(function(button){

      button.addEventListener("click", function(){

        navigate(
          button.dataset.module
        );

      });

    });


  document
    .getElementById("loginForm")
    .addEventListener(
      "submit",
      handleLogin
    );


  document
    .getElementById("mobileMenu")
    .addEventListener(
      "click",
      function(){
        document
          .getElementById("sidebar")
          .classList.toggle("open");
      }
    );


  restoreSession();

});


/* =====================================================
   API
===================================================== */

async function api(payload){

  const response =
    await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(payload)
    });

  const text =
    await response.text();

  let data;

  try{
    data = JSON.parse(text);
  }catch(e){
    throw new Error(
      "Server returned invalid response."
    );
  }

  if(!data.success){
    throw new Error(
      data.message || "Operation failed."
    );
  }

  return data;
}


/* =====================================================
   LOGIN
===================================================== */

async function handleLogin(event){

  event.preventDefault();

  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  const errorBox =
    document.getElementById("loginError");

  errorBox.classList.add("hidden");


  try{

    const result =
      await api({
        action:"login",
        username:username,
        password:password
      });


    currentUser =
      result.user;


    sessionStorage.setItem(
      "radiance_user",
      JSON.stringify(currentUser)
    );


    showApplication();

  }catch(error){

    errorBox.textContent =
      error.message;

    errorBox.classList.remove(
      "hidden"
    );
  }
}


/* =====================================================
   RESTORE
===================================================== */

function restoreSession(){

  const saved =
    sessionStorage.getItem(
      "radiance_user"
    );

  if(!saved){
    return;
  }

  try{

    currentUser =
      JSON.parse(saved);

    showApplication();

  }catch(e){

    sessionStorage.removeItem(
      "radiance_user"
    );
  }
}


/* =====================================================
   SHOW APP
===================================================== */

function showApplication(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  document
    .getElementById("topUserName")
    .textContent =
      currentUser.name || "Radiance";


  document
    .getElementById("topUserRole")
    .textContent =
      currentUser.role || "";


  navigate("dashboard");
}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  sessionStorage.removeItem(
    "radiance_user"
  );

  currentUser = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("loginPassword")
    .value = "";

}


/* =====================================================
   NAVIGATION
===================================================== */

async function navigate(module){

  currentModule =
    module;

  document
    .querySelectorAll(
      ".menu button[data-module]"
    )
    .forEach(function(button){

      button.classList.toggle(
        "active",
        button.dataset.module === module
      );

    });


  document
    .getElementById("pageTitle")
    .textContent =
      moduleNames[module] || module;


  document
    .getElementById("sidebar")
    .classList.remove("open");


  if(module === "dashboard"){

    await renderDashboard();
    return;
  }


  if(module === "Reports"){

    await renderReports();
    return;
  }


  if(module === "DuePayments"){

    await renderDuePayments();
    return;
  }


  await renderModule(module);
}

/* =====================================================
   MODULE TABLE
===================================================== */

function renderModuleTable(){

  const module =
    currentModule;

  let records =
    currentRecords.slice();


  const search =
    document.getElementById("moduleSearch");

  const query =
    search
      ? search.value.toLowerCase().trim()
      : "";


  if(query){

    records =
      records.filter(function(record){

        return Object.keys(record)
          .some(function(key){

            return String(
              record[key]
            )
            .toLowerCase()
            .includes(query);

          });

      });

  }


  const readonly =
    [
      "ActivityLog"
    ].includes(module);


  const content =
    document.getElementById("content");


  let html = `

    <div class="module-toolbar">

      <input
        id="moduleSearch"
        class="search"
        placeholder="Search ${escapeHtml(moduleNames[module] || module)}..."
        value="${escapeHtml(query)}"
        oninput="renderModuleTable()"
      >

      ${
        readonly
        ? ""
        :
        `
        <button
          class="btn btn-primary"
          onclick="openAddModal()"
        >
          + Add New
        </button>
        `
      }

      <button
        class="btn btn-secondary"
        onclick="renderModule('${module}')"
      >
        Refresh
      </button>

    </div>


    <div class="table-card">

      ${
        records.length
        ?
        buildTable(records,module)
        :
        `<div class="loading">
          No records found.
        </div>`
      }

    </div>
  `;


  content.innerHTML =
    html;
}


/* =====================================================
   TABLE
===================================================== */

function buildTable(records,module){

  if(!records.length){
    return "";
  }


  const headers =
    Object.keys(records[0])
      .filter(function(key){
        return key !== "_row" &&
          key !== "Password Hash";
      });


  let html =
    "<table><thead><tr>";


  headers
    .slice(0,10)
    .forEach(function(header){

      html +=
        `<th>${escapeHtml(header)}</th>`;

    });


  if(!["ActivityLog"].includes(module)){
    html += "<th>Actions</th>";
  }


  html +=
    "</tr></thead><tbody>";


  records.forEach(function(record){

    html += "<tr>";


    headers
      .slice(0,10)
      .forEach(function(header){

        let value =
          record[header];

        if(
          header === "Status" ||
          header === "Payment Status" ||
          header === "Application Status" ||
          header === "Visa Status"
        ){

          html +=
            `<td>${statusBadge(value)}</td>`;

        }else{

          html +=
            `<td>${formatCell(value)}</td>`;
        }

      });


    if(!["ActivityLog"].includes(module)){

      html += `

        <td class="actions">

          <button
            class="action-btn edit-btn"
            onclick="editRecord(${record._row})"
          >
            Edit
          </button>

          <button
            class="action-btn delete-btn"
            onclick="deleteRecord(${record._row})"
          >
            Delete
          </button>

        </td>

      `;
    }


    html += "</tr>";

  });


  html +=
    "</tbody></table>";


  return html;
}

===================================================== */

function openRecordModal(record,title){

  const modal =
    document.getElementById(
      "modalOverlay"
    );

  document
    .getElementById("modalTitle")
    .textContent =
      title;


  const body =
    document.getElementById(
      "modalBody"
    );


  const headers =
    getModuleHeaders(
      currentModule
    );


  let html =
    `<div class="form-grid">`;


  headers.forEach(function(header){

    if(
      header === "Password Hash" ||
      header === "Created At" ||
      header === "Updated At" ||
      header === "Last Login" ||
      header === "Uploaded At" ||
      header === "Timestamp" ||
      header === "Completed At"
    ){
      return;
    }


    if(
      header.endsWith(" ID") &&
      record &&
      record[header]
    ){

      html += field(
        header,
        record[header],
        "text",
        true
      );

      return;
    }


    let value =
      record
        ? record[header] || ""
        : "";


    html +=
      createDynamicField(
        header,
        value
      );

  });


  html +=
    `</div>`;


  body.innerHTML =
    html;


  modal.classList.add(
    "show"
  );
}


/* =====================================================
   FIELD GENERATION
===================================================== */

function createDynamicField(header,value){

  const id =
    fieldId(header);

  const lower =
    header.toLowerCase();


  let full =
    lower.includes("description") ||
    lower.includes("notes") ||
    lower.includes("remarks") ||
    lower.includes("requirement") ||
    lower.includes("recommendation") ||
    lower.includes("message") ||
    lower.includes("address");


  /* COUNTRY */

  if(lower === "country" ||
     lower.includes("preferred country") ||
     lower.includes("interested country")){

    const options =
      dropdowns.countries || [];

    return selectField(
      header,
      value,
      options.map(function(x){
        return {
          value:x["Country Name"],
          label:
            (x.Flag || "") +
            " " +
            x["Country Name"]
        };
      }),
      full
    );
  }


  /* STUDENT */

  if(lower === "student id" ||
     lower === "related student"){

    const options =
      dropdowns.students || [];

    return selectField(
      header,
      value,
      options.map(function(x){
        return {
          value:x["Student ID"],
          label:
            x["Student ID"] +
            " - " +
            x.Name
        };
      }),
      full
    );
  }


  /* LEAD */

  if(lower === "lead id"){

    const options =
      dropdowns.leads || [];

    return selectField(
      header,
      value,
      options.map(function(x){
        return {
          value:x["Lead ID"],
          label:
            x["Lead ID"] +
            " - " +
            x.Name
        };
      }),
      full
    );
  }


  /* USER */

  if(
    lower.includes("assigned") ||
    lower === "counsellor" ||
    lower === "teacher" ||
    lower === "received by" ||
    lower === "paid by"
  ){

    const options =
      dropdowns.users || [];

    return selectField(
      header,
      value,
      options.map(function(x){
        return {
          value:x.name,
          label:
            x.name +
            " (" +
            x.role +
            ")"
        };
      }),
      full
    );
  }


  /* UNIVERSITY */

  if(
    lower === "university" ||
    lower === "preferred university"
  ){

    const options =
      dropdowns.universities || [];

    return selectField(
      header,
      value,
      options.map(function(x){
        return {
          value:x["University Name"],
          label:x["University Name"]
        };
      }),
      full
    );
  }


  /* COURSE */

  if(
    lower === "course" ||
    lower === "preferred course"
  ){

    const options =
      dropdowns.courses || [];

    return selectField(
      header,
      value,
      options.map(function(x){
        return {
          value:x["Course Name"],
          label:x["Course Name"]
        };
      }),
      full
    );
  }


  /* ROLE */

  if(header === "Role"){

    return selectField(
      header,
      value,
      [
        "Super Admin",
        "Counsellor",
        "Application Officer",
        "Visa Officer",
        "Accountant",
        "IELTS Teacher"
      ].map(function(x){
        return {
          value:x,
          label:x
        };
      }),
      false
    );
  }


  /* PASSWORD */

  if(header === "Password"){

    return field(
      header,
      value,
      "password",
      false
    );
  }


  /* BOOLEAN */

  if(
    ["Required","Received","Verified","Is Read","Featured"]
      .includes(header)
  ){

    return selectField(
      header,
      value,
      [
        {value:"Yes",label:"Yes"},
        {value:"No",label:"No"}
      ],
      false
    );
  }


  /* STATUS */

  if(
    header === "Status" ||
    header === "Application Status" ||
    header === "Payment Status" ||
    header === "Visa Status" ||
    header === "Verification Status" ||
    header === "Partner Status" ||
    header === "Deposit Status"
  ){

    const options =
      statusOptions(header);

    return selectField(
      header,
      value,
      options.map(function(x){
        return {
          value:x,
          label:x
        };
      }),
      false
    );
  }


  /* PAYMENT METHOD */

  if(header === "Payment Method"){

    return selectField(
      header,
      value,
      [
        "Cash",
        "Bank",
        "bKash",
        "Nagad",
        "Rocket",
        "Card",
        "Other"
      ].map(function(x){
        return {
          value:x,
          label:x
        };
      }),
      false
    );
  }


  /* TEXTAREA */

  if(full){

    return `
      <div class="form-group full">

        <label>
          ${escapeHtml(header)}
        </label>

        <textarea
          id="${id}"
          class="form-control"
        >${escapeHtml(String(value))}</textarea>

      </div>
    `;
  }


  /* DATE */

  if(
    lower.includes("date") ||
    lower.includes("deadline")
  ){

    return field(
      header,
      value,
      "date",
      false
    );
  }


  /* TIME */

  if(lower.includes("time")){

    return field(
      header,
      value,
      "time",
      false
    );
  }


  /* NUMBER */

  if(
    lower.includes("amount") ||
    lower.includes("fee") ||
    lower.includes("budget") ||
    lower.includes("score") ||
    lower.includes("gpa") ||
    lower.includes("ranking") ||
    lower.includes("capacity") ||
    lower.includes("year")
  ){

    return field(
      header,
      value,
      "number",
      false
    );
  }


  /* USERS PASSWORD FIELD */

  if(
    currentModule === "Users" &&
    header === "Password"
  ){

    return field(
      header,
      value,
      "password",
      false
    );
  }


  return field(
    header,
    value,
    "text",
    false
  );
}


/* =====================================================
   FIELD
===================================================== */

function field(
  header,
  value,
  type,
  readonly
){

  const id =
    fieldId(header);


  return `
    <div class="form-group">

      <label>
        ${escapeHtml(header)}
      </label>

      <input
        id="${id}"
        class="form-control"
        type="${type}"
        value="${escapeHtml(String(value || ""))}"
        ${readonly ? "readonly" : ""}
      >

    </div>
  `;
}


function selectField(
  header,
  value,
  options,
  full
){

  const id =
    fieldId(header);


  let html =
    `<div class="form-group ${full ? "full" : ""}">

      <label>
        ${escapeHtml(header)}
      </label>

      <select
        id="${id}"
        class="form-control"
      >

      <option value="">
        Select ${escapeHtml(header)}
      </option>`;


  options.forEach(function(option){

    html += `
      <option
        value="${escapeHtml(String(option.value))}"
        ${String(option.value) === String(value) ? "selected" : ""}
      >
        ${escapeHtml(String(option.label))}
      </option>
    `;

  });


  html +=
    `</select></div>`;


  return html;
}


/* =====================================================
   STATUS OPTIONS
===================================================== */

function statusOptions(header){

  if(header === "Application Status"){
    return [
      "Pending",
      "Submitted",
      "Under Review",
      "Conditional Offer",
      "Unconditional Offer",
      "Rejected",
      "Withdrawn",
      "Completed"
    ];
  }


  if(header === "Payment Status"){
    return [
      "Pending",
      "Partial",
      "Paid",
      "Due",
      "Refunded"
    ];
  }


  if(header === "Visa Status"){
    return [
      "Not Started",
      "Preparing",
      "Submitted",
      "Biometrics",
      "Medical",
      "Interview",
      "Granted",
      "Refused",
      "Withdrawn"
    ];
  }


  if(header === "Verification Status"){
    return [
      "Pending",
      "Verified",
      "Rejected"
    ];
  }


  if(header === "Partner Status"){
    return [
      "Partner",
      "Non-Partner",
      "Pending"
    ];
  }


  if(header === "Deposit Status"){
    return [
      "Pending",
      "Paid",
      "Not Required"
    ];
  }


  return [
    "Active",
    "Inactive",
    "Pending",
    "Completed",
    "Cancelled",
    "Rejected"
  ];
}


/* =====================================================
   SUBMIT
===================================================== */

async function submitForm(){

  const module =
    currentModule;


  const headers =
    getModuleHeaders(module);


  const record = {};


  headers.forEach(function(header){

    if(
      header === "Password Hash" ||
      header === "Created At" ||
      header === "Updated At" ||
      header === "Last Login" ||
      header === "Uploaded At" ||
      header === "Timestamp" ||
      header === "Completed At"
    ){
      return;
    }


    const element =
      document.getElementById(
        fieldId(header)
      );


    if(element){

      record[header] =
        element.value;
    }

  });


  if(currentEditRecord){

    record._row =
      currentEditRecord._row;
  }


  /* USERS PASSWORD */

  if(module === "Users"){

    const passwordElement =
      document.getElementById(
        fieldId("Password")
      );

    if(passwordElement){

      record.Password =
        passwordElement.value;
    }
  }


  const saveButton =
    document.getElementById(
      "saveBtn"
    );

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";


  try{

    await api({

      action:"save",

      module:module,

      record:record,

      user:currentUser

    });


    closeModal();

    showToast(
      "Saved successfully.",
      "success"
    );


    await renderModule(module);


  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }finally{

    saveButton.disabled = false;
    saveButton.textContent = "Save";

  }
}


/* =====================================================
   DELETE
===================================================== */

async function deleteRecord(row){

  const record =
    currentRecords.find(function(item){

      return Number(item._row) ===
        Number(row);

    });


  if(!record){
    return;
  }


  const name =
    record.Name ||
    record["Country Name"] ||
    record["University Name"] ||
    record["Course Name"] ||
    record["Student ID"] ||
    record["Lead ID"] ||
    record["Application ID"] ||
    record[Object.keys(record)[1]] ||
    "this record";


  if(
    !confirm(
      "Are you sure you want to delete " +
      name +
      "?"
    )
  ){
    return;
  }


  try{

    await api({

      action:"delete",

      module:currentModule,

      row:row,

      user:currentUser

    });


    showToast(
      "Deleted successfully.",
      "success"
    );


    await renderModule(
      currentModule
    );


  }catch(error){

    showToast(
      error.message,
      "error"
    );
  }
}

async function renderDuePayments(){

    document.getElementById("content");

    `<div class="loading">Loading due payments...</div>`;


  try{

    const result =
      await api({
        action:"list",
        module:"Invoices",

      });

      (result.records || [])
        .filter(function(x){

        });


    currentModule =
      "Invoices";

    currentRecords =
      records;


    document
      .getElementById("pageTitle")
      .textContent =
        "Due Payments";


    const total =
      records.reduce(
        function(sum,x){
          return sum +
            (Number(x["Due Amount"]) || 0);
        },
        0
      );


    content.innerHTML = `

      <div class="stats">

        ${statCard(
          "Total Due Invoices",
          records.length
        )}

        ${statCard(
          "Total Due Amount",
          formatMoney(total)
        )}

      </div>


      <div class="table-card">

        ${
          records.length
          ?
          buildTable(
            records,
            "Invoices"
          )
          :
          `<div class="loading">
            No due payments.
          </div>`
        }

    `;


  }catch(error){

    showError(error);
  }
}

/* =====================================================
   HELPERS
===================================================== */

function fieldId(header){

  return "field_" +
    header
      .replace(/[^a-zA-Z0-9]/g,"_");
}


function formatMoney(value){

  const number =
    Number(value) || 0;

  return "৳ " +
    number.toLocaleString(
      "en-BD",
      {
        maximumFractionDigits:2
      }
    );
}


function formatCell(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "-";
  }

  const text =
    String(value);

  if(text.length > 120){

    return escapeHtml(
      text.substring(0,120) +
      "..."
    );
  }

  return escapeHtml(text);
}


function statusBadge(value){

  const text =
    String(value || "—");

  const cls =
    text
      .toLowerCase()
      .replace(/\s+/g,"-");


  return `
    <span class="badge ${cls}">
      ${escapeHtml(text)}
    </span>
  `;
}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showToast(message,type){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.className =
    "toast show " +
    (type || "");


  setTimeout(function(){

    toast.classList.remove(
      "show"
    );

  },3500);
}


function showError(error){

  console.error(error);

  const content =
    document.getElementById(
      "content"
    );

  content.innerHTML = `

    <div class="card">

      <div class="card-body">

        <h3>
          Something went wrong
        </h3>

        <br>

        <p>
          ${escapeHtml(
            error.message ||
            String(error)
          )}
        </p>

        <br>

        <button
          class="btn btn-primary"
          onclick="navigate('${currentModule}')"
        >
          Try Again
        </button>

      </div>

    </div>
  `;

  showToast(
    error.message ||
    "Something went wrong.",
    "error"
  );
}


function renderActivityTable(records){

  let html =
    `<table style="min-width:0">

      <thead>

        <tr>
          <th>Time</th>
          <th>User</th>
          <th>Action</th>
          <th>Module</th>
          <th>Description</th>
        </tr>

      </thead>

      <tbody>`;


  records.forEach(function(item){

    html += `

      <tr>

        <td>
          ${formatCell(item.Timestamp)}
        </td>

        <td>
          ${formatCell(item["User Name"])}
        </td>

        <td>
          ${formatCell(item.Action)}
        </td>

        <td>
          ${formatCell(item.Module)}
        </td>

        <td>
          ${formatCell(item.Description)}
        </td>

      </tr>

    `;

  });


  html +=
    "</tbody></table>";


  return html;
}
