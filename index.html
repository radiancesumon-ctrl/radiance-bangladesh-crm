<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radiance Bangladesh CRM</title>
<style>
:root{--p:#6d28d9;--p2:#4f46e5;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#64748b;--bd:#e5e7eb;--danger:#b91c1c;--success:#166534}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#6d28d9,#2563eb)}.loginbox{width:min(430px,100%);background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0004;text-align:center}.logo{width:92px;height:92px;object-fit:contain}.loginbox input{width:100%;padding:12px;margin:8px 0;border:1px solid var(--bd);border-radius:9px}.primary{background:var(--p);color:#fff;border:0;padding:10px 15px;border-radius:8px}.secondary{background:#eef2ff;color:#3730a3;border:0;padding:8px 12px;border-radius:8px}.danger{background:#fee2e2;color:#991b1b;border:0;padding:7px 10px;border-radius:7px}.success{background:#dcfce7;color:#166534;border:0;padding:7px 10px;border-radius:7px}.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:240px;background:#111827;color:#fff;padding:16px 10px;overflow:auto}.brand{display:flex;gap:9px;align-items:center;margin:3px 8px 18px}.brand img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px}.brand b{display:block}.brand small{color:#9ca3af}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d1d5db;border:0;padding:9px 11px;border-radius:7px;margin:2px 0}.nav button:hover,.nav button.active{background:#312e81;color:#fff}.logout{width:100%;margin-top:15px;padding:9px;border:0;border-radius:7px}.main{margin-left:240px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0 0 3px}.muted{color:var(--muted)}.user{display:flex;align-items:center;gap:9px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#eee}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:26px;margin-top:6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:#fff}.tablewrap{overflow:auto;border:1px solid var(--bd);border-radius:9px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font-size:12px;vertical-align:top}.table th{background:#f8fafc;position:sticky;top:0}.actions{display:flex;gap:5px}.wa{background:#dcfce7;color:#166534;padding:5px 8px;border-radius:5px;text-decoration:none}.pager{display:flex;justify-content:space-between;align-items:center;padding-top:12px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;width:min(960px,100%);max-height:94vh;overflow:auto;border-radius:14px;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px;background:#fff}.field textarea{min-height:78px;resize:vertical}.full{grid-column:1/-1}.photo{width:90px;height:90px;object-fit:cover;border-radius:9px;border:1px solid var(--bd);display:block;margin-top:7px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0}.close{background:#f1f5f9;border:0;border-radius:7px;padding:7px 10px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 15px;border-radius:8px;z-index:100;max-width:420px}.toast.err{background:#991b1b}.summary{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.summary .stat{padding:11px}.summary .stat b{font-size:20px}.empty{padding:30px;text-align:center;color:var(--muted)}.loading{padding:30px;text-align:center;color:var(--muted)}.note{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:8px;margin-bottom:12px}.link{color:#4f46e5;text-decoration:none}.filehint{font-size:11px;color:var(--muted);margin-top:4px}@media(max-width:900px){.side{position:relative;width:100%;height:auto}.main{margin-left:0}.grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid,.formgrid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.top{display:block}.user{margin-top:10px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><img class="logo" src="./logo.png" onerror="this.onerror=null;this.src='./assets/logo.png'"><h2>Radiance Bangladesh CRM</h2><p class="muted">CRM & Business Management System</p><input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button id="loginBtn" class="primary" style="width:100%;margin-top:8px" onclick="login()">Login</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand"><img src="./logo.png" onerror="this.onerror=null;this.src='./assets/logo.png'"><div><b>Radiance Bangladesh</b><small>CRM & BMS</small></div></div><div id="nav" class="nav"></div><button class="logout" onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span class="muted">Radiance Bangladesh</span></div><div class="user"><img id="up" class="avatar" src="./logo.png" onerror="this.onerror=null;this.src='./assets/logo.png'"><span id="un"></span></div></div><div id="content"></div></main></div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxY1JlVa4vhxSQmJwI62WHHA_DkDXR2sYSYOr8thOtMqTMsH7oqsiEXUNMczh9zwW1Z/exec';
const ADMIN_ONLY=['Users','Roles','Settings','ActivityLog'];
const MODULES=[
 ['Dashboard','Dashboard'],['Leads','Leads'],['Students','Students'],['Counselling','Counselling'],['FollowUps','Follow Ups'],['Tasks','Tasks'],
 ['EmployeeAttendance','Employee Attendance'],['LeaveManagement','Leave Management'],['IELTS_Batches','IELTS Batches'],['IELTS_Students','IELTS Students'],['IELTS_Attendance','IELTS Attendance'],['IELTS_MockTests','IELTS Mock Tests'],['IELTS_Results','IELTS Results'],
 ['Countries','Countries'],['Universities','Universities'],['Courses','Courses'],['Intake','Intake'],['Applications','Applications'],['Documents','Documents'],['DocumentChecklist','Document Checklist'],['Offers','Offers'],['Visa','Visa'],
 ['Payments','Payments'],['Invoices','Invoices'],['MoneyReceipts','Money Receipts'],['Income','Income'],['Expenses','Expenses'],['DuePayments','Due Payments'],['Reports','Reports'],['StudentPortal','Student Portal'],['Notifications','Notifications'],['Timeline','Timeline'],['LeadSources','Lead Sources'],['Users','Staff / Users'],['Roles','Roles'],['ActivityLog','Activity Log'],['Settings','Settings']
];
let token=sessionStorage.getItem('radiance_token')||'';let user=readJSON('radiance_user');let dd=null;let moduleCache={};let current={module:'Dashboard',page:1,size:20,search:'',filters:{}};
const $=id=>document.getElementById(id);function readJSON(k){try{return JSON.parse(sessionStorage.getItem(k)||'null')}catch(e){return null}}function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function toast(msg,err=false){const t=$('toast');t.textContent=msg;t.className='toast'+(err?' err':'');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),3500)}function label(m){return(MODULES.find(x=>x[0]===m)||[m,m])[1]}
async function api(action,data={}){const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data})});let x;try{x=await res.json()}catch(e){throw Error('API response was not valid JSON. Check the Apps Script deployment.')}if(!x.ok){if(/session expired/i.test(x.error||'')){sessionStorage.removeItem('radiance_token');sessionStorage.removeItem('radiance_user');token='';user=null;showLogin()}throw Error(x.error||'Request failed')}return x}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function login(){const username=$('lu').value.trim(),password=$('lp').value; if(!username||!password){$('loginMsg').textContent='Username and password are required.';return}const b=$('loginBtn');b.disabled=true;b.textContent='Signing in...';$('loginMsg').textContent='';try{const x=await api('login',{username,password});token=x.token;user=x.user;sessionStorage.setItem('radiance_token',token);sessionStorage.setItem('radiance_user',JSON.stringify(user));start()}catch(e){$('loginMsg').textContent=e.message;toast(e.message,true)}finally{b.disabled=false;b.textContent='Login'}}
async function logout(){try{if(token)await api('logout',{});}catch(e){}sessionStorage.removeItem('radiance_token');sessionStorage.removeItem('radiance_user');token='';user=null;moduleCache={};dd=null;showLogin()}
function start(){if(!token||!user){showLogin();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('un').textContent=(user.name||user.username)+' • '+(user.role||'');if(user.photo)$('up').src=user.photo;buildNav();openModule('Dashboard')}
function buildNav(){const n=$('nav');n.innerHTML='';MODULES.forEach(([m,l])=>{if(user.role!=='Admin'&&ADMIN_ONLY.includes(m))return;const b=document.createElement('button');b.textContent=l;b.dataset.module=m;b.onclick=()=>openModule(m);n.appendChild(b)})}
function openModule(m){current={module:m,page:1,size:20,search:'',filters:{}};$('title').textContent=label(m);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.module===m));if(m==='Dashboard')return renderDashboard();if(m==='Reports')return renderReports();if(m==='DuePayments')return renderDuePayments();if(m==='EmployeeAttendance')return renderAttendance();renderList()}
async function renderDashboard(){const c=$('content');c.innerHTML='<div class="loading">Loading dashboard...</div>';try{const x=await api('dashboard');const q=x.data.counts;c.innerHTML='<div class="grid">'+[['Leads','Leads'],['Students','Students'],['Applications','Applications'],['Invoices','Invoices'],['Payments','Payments'],['Expenses','Expenses'],['Users','Users'],['EmployeeAttendance','Employee Attendance']].map(a=>`<div class="stat"><span>${a[0]}</span><b>${q[a[1]]??0}</b></div>`).join('')+'</div><div class="card" style="margin-top:14px"><b>Welcome, '+esc(user.name||user.username)+'</b><p class="muted">Use the left menu to manage students, applications, IELTS, staff, attendance, leave, finance and other CRM records.</p></div>'}catch(e){c.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function renderList(){const c=$('content');const key=current.module+'|'+current.page+'|'+current.size+'|'+current.search+'|'+JSON.stringify(current.filters);if(moduleCache[key]){drawList(moduleCache[key]);return}c.innerHTML='<div class="loading">Loading '+esc(label(current.module))+'...</div>';try{const x=await api('list',{module:current.module,page:current.page,pageSize:current.size,search:current.search,filters:current.filters});moduleCache[key]=x.data;drawList(x.data)}catch(e){c.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
function drawList(data){const c=$('content');let toolbar=`<div class="toolbar"><input id="search" value="${esc(current.search)}" placeholder="Search ${esc(label(current.module))}..." onkeydown="if(event.key==='Enter'){current.search=this.value;current.page=1;renderList()}"><button class="primary" onclick="current.search=$('search').value;current.page=1;renderList()">Search</button><button class="secondary" onclick="current.search='';current.page=1;renderList()">Clear</button>`;if(current.module!=='ActivityLog')toolbar+=`<button class="primary" onclick="openForm()">+ Add New</button>`;toolbar+=`<button class="secondary" onclick="invalidateAndRefresh()">Refresh</button></div>`;let table='<div class="tablewrap"><table class="table"><thead><tr>'+data.headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>';if(!data.rows.length)table+='<tr><td colspan="'+(data.headers.length+1)+'"><div class="empty">No records found.</div></td></tr>';data.rows.forEach(r=>{table+='<tr>'+r.map((v,i)=>cell(data.headers[i],v)).join('')+'<td>'+actionsForRow(data.headers,r)+'</td></tr>'});table+='</tbody></table></div>';const pages=Math.max(1,Math.ceil(data.total/data.pageSize));c.innerHTML=toolbar+table+`<div class="pager"><span>Page ${data.page} of ${pages} • ${data.total} records</span><span><button class="secondary" ${data.page<=1?'disabled':''} onclick="current.page--;renderList()">Previous</button> <button class="secondary" ${data.page>=pages?'disabled':''} onclick="current.page++;renderList()">Next</button></span></div>`}
function cell(h,v){if(['Phone','WhatsApp','Mobile','Contact','Phone Number','Mobile Number'].includes(h)&&String(v).trim())return `<td>${esc(v)} <a class="wa" target="_blank" href="https://wa.me/${waNumber(v)}">WhatsApp</a></td>`;if(h==='Photo'&&String(v).startsWith('http'))return `<td><img class="photo" src="${esc(v)}" onerror="this.style.display='none'"></td>`;if(h==='File URL'&&String(v).startsWith('http'))return `<td><a class="link" target="_blank" href="${esc(v)}">Open file</a></td>`;return '<td>'+esc(v)+'</td>'}
function waNumber(v){let s=String(v).replace(/\D/g,'');if(s.startsWith('880'))return s;if(s.startsWith('0'))return '880'+s.slice(1);return s.startsWith('1')?'880'+s:s}
function actionsForRow(headers,row){if(current.module==='ActivityLog')return '<span class="muted">Read only</span>';const id=String(row[0]??'');let out=`<div class="actions"><button class="secondary" onclick='openForm(${JSON.stringify(id)})'>Edit</button>`;if(current.module==='Notifications' && String(row[headers.indexOf('Is Read')]||'').toLowerCase()!=='yes')out+=`<button class="success" onclick='markRead(${JSON.stringify(id)})'>Mark read</button>`;out+=`<button class="danger" onclick='removeRecord(${JSON.stringify(id)})'>Delete</button></div>`;return out}
async function invalidateAndRefresh(){moduleCache={};dd=null;renderList()}
async function loadDropdowns(){if(dd)return dd;const x=await api('dropdowns');dd=x.data;return dd}
function fieldType(h,m){if(['Created At','Updated At','Password Hash'].includes(h))return 'hidden';if(h==='Password'&&m==='Users')return 'password';if(h==='Photo'&&m==='Users')return 'photo';if(h==='File URL'&&m==='Documents')return 'hidden';if(h==='Date'||h.endsWith(' Date')||h==='DOB'||h==='Start Date'||h==='End Date'||h==='Due Date'||h==='Deadline'||h==='Offer Date'||h==='Application Date'||h==='Submission Date'||h==='Decision Date'||h==='Enrollment Date'||h==='Income Date'||h==='Expense Date'||h==='Receipt Date'||h==='Test Date')return 'date';if(h==='Time'||h==='Check In'||h==='Check Out')return 'time';if(h.includes('Description')||h==='Notes'||h==='Remarks'||h==='Reason'||h==='Message'||h==='Details'||h==='Schedule')return 'textarea';return 'text'}
function employeeKind(h){if(h==='Employee ID'||h==='Staff ID'||h==='Teacher ID')return 'id';if(h==='Employee Name'||h==='Staff Name')return 'name';if(['Employee','Teacher','Assigned Employee','Assigned To','Counsellor','Received By','Paid By','Approved By'].includes(h))return 'combo';return ''}
function optionsFor(h,m,value){const v=String(value??'');let arr=[];const ek=employeeKind(h);if(ek){const es=dd.employees||[];if(ek==='id')arr=es.map(e=>[e.id,e.id+' — '+e.name]);else if(ek==='name')arr=es.map(e=>[e.name,e.name+' — '+e.id]);else arr=es.map(e=>[e.id,e.id+' — '+e.name]);}else if(h==='Role')arr=(dd.roles||[]).map(x=>[x.name,x.name]);else if(h==='Country'||h==='Country Name')arr=(dd.countries||[]).map(x=>[x.name,x.name]);else if(h==='University ID')arr=(dd.universities||[]).map(x=>[x.id,x.id+' — '+x.name]);else if(h==='Course ID')arr=(dd.courses||[]).map(x=>[x.id,x.id+' — '+x.name]);else if(h==='Student ID')arr=(dd.students||[]).map(x=>[x.id,x.id+' — '+x.label]);else if(h==='Lead ID')arr=(dd.leads||[]).map(x=>[x.id,x.id+' — '+x.label]);else if(h==='Application ID')arr=(dd.applications||[]).map(x=>[x.id,x.id+' — '+x.label]);else if(h==='Invoice ID')arr=(dd.invoices||[]).map(x=>[x.id,x.id+' — '+x.label]);else if(h==='Batch ID')arr=(dd.batches||[]).map(x=>[x.id,x.id+' — '+x.label]);else if(h==='IELTS Student ID')arr=(dd.ieltsStudents||[]).map(x=>[x.id,x.id+' — '+x.label]);else if(h==='Source')arr=(dd.sources||[]).map(x=>[x.label,x.label]);else if(h==='Leave Status')arr=[];else if(h==='Status')arr=statusOptions(m);else if(h==='Application Status')arr=['Draft','Submitted','Offer','Conditional Offer','Rejected','Withdrawn','Completed'].map(x=>[x,x]);else if(h==='Offer Type')arr=['Conditional','Unconditional'].map(x=>[x,x]);else if(h==='Payment Method'||h==='Method')arr=['Cash','bKash','Nagad','Rocket','Bank','Card','Other'].map(x=>[x,x]);else if(h==='Priority')arr=['Low','Medium','High','Urgent'].map(x=>[x,x]);else if(['Received','Verified','Required','Is Read'].includes(h))arr=['Yes','No'].map(x=>[x,x]);else if(h==='Gender')arr=['Male','Female','Other'].map(x=>[x,x]);if(v&&!arr.some(x=>String(x[0])===v))arr.unshift([v,v]);return arr}
function statusOptions(m){if(m==='EmployeeAttendance')return ['Present','Absent','Late','Half Day','Leave'].map(x=>[x,x]);if(m==='LeaveManagement')return ['Pending','Approved','Rejected','Cancelled'].map(x=>[x,x]);if(m==='Countries'||m==='LeadSources')return ['Active','Inactive'].map(x=>[x,x]);if(m==='Tasks')return ['Pending','In Progress','Completed','Cancelled'].map(x=>[x,x]);if(m==='Invoices')return ['Unpaid','Partially Paid','Paid','Overdue'].map(x=>[x,x]);if(m==='Visa')return ['Pending','Submitted','Approved','Refused','Withdrawn'].map(x=>[x,x]);return ['Active','Inactive'].map(x=>[x,x])}
async function openForm(id=''){try{await loadDropdowns();const x=id?await api('list',{module:current.module,page:1,pageSize:100,search:String(id)}):{data:{headers:[],rows:[]}};let record={};if(id){const d=x.data;const idx=d.rows.findIndex(r=>String(r[0])===String(id));if(idx<0)throw Error('Record not found.');d.headers.forEach((h,i)=>record[h]=d.rows[idx][i])}const headers=Object.keys(record).length?Object.keys(record):await schemaHeaders(current.module);renderForm(headers,record,id)}catch(e){toast(e.message,true)}}
async function schemaHeaders(m){const x=await api('list',{module:m,page:1,pageSize:1});return x.data.headers}
function renderForm(headers,record,id){const m=current.module;let html=`<div class="modalbox"><div class="modalhead"><h2>${id?'Edit ':'Add '}${esc(label(m))}</h2><button class="close" onclick="closeModal()">Close</button></div><form id="recordForm" onsubmit="submitForm(event)"><div class="formgrid">`;
headers.forEach(h=>{if(['Password Hash','Created At','Updated At'].includes(h))return;const val=record[h]??'';if(m==='Users'&&h==='Password'){}const type=fieldType(h,m);if(type==='hidden')return;let req=(h===headers[0]&&id)?'':(['Full Name','Username','Role'].includes(h)&&m==='Users'?'required':'');const ek=employeeKind(h);if(ek||optionsFor(h,m,val).length){let opts=optionsFor(h,m,val);html+=`<div class="field"><label>${esc(h)}</label><select data-field="${esc(h)}" ${req} ${h==='Marked By'?'disabled':''} onchange="syncEmployee(this)"><option value="">Select ${esc(h)}</option>${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(val)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;return}if(type==='textarea'){html+=`<div class="field full"><label>${esc(h)}</label><textarea data-field="${esc(h)}">${esc(val)}</textarea></div>`;return}if(type==='photo'){html+=`<div class="field"><label>Staff Photo</label><input type="file" id="staffPhoto" accept="image/*" onchange="previewPhoto(this)">${val?`<img id="photoPreview" class="photo" src="${esc(val)}">`:'<img id="photoPreview" class="photo hidden">'}<div class="filehint">Photo will be uploaded to Google Drive.</div></div>`;return}if(h==='Phone')req='required';html+=`<div class="field"><label>${esc(h)}</label><input data-field="${esc(h)}" type="${type==='date'?'date':type==='time'?'time':type==='password'?'password':'text'}" value="${esc(formatInputValue(val,type))}" ${req}></div>`});if(m==='Documents')html+=`<div class="field full"><label>Upload Document File</label><input type="file" id="documentFile"><div class="filehint">The selected file will be uploaded to Google Drive when you save.</div></div>`;if(m==='Users'&&id)html+=`<div class="field full"><div class="note">Leave Password blank to keep the existing password.</div></div>`;html+=`</div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save</button></div></form></div>`;$('modal').innerHTML=html;$('modal').classList.remove('hidden');window.__editingId=id;window.__record=record;window.__headers=headers;applyDefaults(m,record);}
function formatInputValue(v,type){if(!v)return '';if(type==='date')return String(v).slice(0,10);if(type==='time')return String(v).slice(0,5);return v}
function applyDefaults(m,r){const set=(f,v)=>{const e=document.querySelector(`[data-field="${CSS.escape(f)}"]`);if(e&&!String(r[f]??''))e.value=v};if(m==='EmployeeAttendance'){set('Date',new Date().toISOString().slice(0,10));set('Status','Present');const mk=document.querySelector('[data-field="Marked By"]');if(mk)mk.value=user.employeeId||user.name||user.username}if(m==='LeaveManagement')set('Status','Pending');if(m==='Documents'){const u=document.querySelector('[data-field="Uploaded By"]');if(u&&!r['Uploaded By'])u.value=user.employeeId||user.name||user.username}syncAllEmployees()}
function syncEmployee(el){const f=el.dataset.field,val=el.value;if(!dd||!dd.employees)return;let e;if(f==='Employee ID'||f==='Staff ID'||f==='Teacher ID')e=dd.employees.find(x=>x.id===val);else if(f==='Employee Name'||f==='Staff Name')e=dd.employees.find(x=>x.name===val);else if(['Employee','Teacher','Assigned Employee','Assigned To','Counsellor','Received By','Paid By','Approved By'].includes(f))return;if(!e)return;const idFields=['Employee ID','Staff ID','Teacher ID'],nameFields=['Employee Name','Staff Name'];document.querySelectorAll('[data-field]').forEach(x=>{if(idFields.includes(x.dataset.field))x.value=e.id;if(nameFields.includes(x.dataset.field))x.value=e.name})}
function syncAllEmployees(){const idEl=document.querySelector('[data-field="Employee ID"]'),nameEl=document.querySelector('[data-field="Employee Name"]');if(idEl&&idEl.value)syncEmployee(idEl);else if(nameEl&&nameEl.value)syncEmployee(nameEl)}
function previewPhoto(input){if(!input.files[0])return;const img=$('photoPreview');img.src=URL.createObjectURL(input.files[0]);img.classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML='';window.__editingId='';window.__record={};window.__headers=[]}
async function submitForm(ev){ev.preventDefault();const m=current.module,record={};document.querySelectorAll('#recordForm [data-field]').forEach(e=>{if(e.disabled&&e.dataset.field==='Marked By')return;record[e.dataset.field]=e.value});if(m==='EmployeeAttendance'&&document.querySelector('[data-field="Marked By"]'))record['Marked By']=user.employeeId||user.name||user.username;if(m==='Documents'&&document.querySelector('[data-field="Uploaded By"]'))record['Uploaded By']=user.employeeId||user.name||user.username;const btn=document.querySelector('#recordForm button[type="submit"]');btn.disabled=true;btn.textContent='Saving...';try{if(m==='Users'){const f=$('staffPhoto');if(f&&f.files[0]){const b=await fileData(f.files[0],1200,.82);const up=await api('uploadStaffPhoto',b);record.Photo=up.data.url}}if(m==='Documents'){const f=$('documentFile');if(f&&f.files[0]){const b=await fileData(f.files[0],1600,.82);const up=await api('uploadDocument',b);record['File URL']=up.data.url}}const x=await api('save',{module:m,record,id:window.__editingId});toast('Saved successfully.');closeModal();moduleCache={};dd=null;renderList()}catch(e){toast(e.message,true)}finally{btn.disabled=false;btn.textContent='Save'}}
function fileData(file,max,quality){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/')){const r=new FileReader();r.onload=()=>resolve({data:r.result,fileName:file.name,mimeType:file.type});r.onerror=reject;r.readAsDataURL(file);return}const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve({data:c.toDataURL('image/jpeg',quality),fileName:(file.name.replace(/\.[^.]+$/,'')||'upload')+'.jpg',mimeType:'image/jpeg'})};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function removeRecord(id){if(!confirm('Delete this record?'))return;try{await api('delete',{module:current.module,id});toast('Deleted successfully.');moduleCache={};dd=null;renderList()}catch(e){toast(e.message,true)}}
async function markRead(id){try{await api('markNotificationRead',{id});toast('Notification marked as read.');moduleCache={};renderList()}catch(e){toast(e.message,true)}}
async function renderAttendance(){const c=$('content');c.innerHTML='<div class="loading">Loading attendance...</div>';try{await loadDropdowns();const s=await api('attendanceSummary',{});const d=s.data;c.innerHTML=`<div class="summary"><div class="stat"><span>Total</span><b>${d.total}</b></div><div class="stat"><span>Present</span><b>${d.Present}</b></div><div class="stat"><span>Absent</span><b>${d.Absent}</b></div><div class="stat"><span>Late</span><b>${d.Late}</b></div><div class="stat"><span>Half Day</span><b>${d['Half Day']}</b></div><div class="stat"><span>Leave</span><b>${d.Leave}</b></div></div>`;renderList()}catch(e){c.innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
function renderReports(){const c=$('content');c.innerHTML='<div class="grid"><div class="card"><b>Reports</b><p class="muted">Use module search and pagination for live records. Attendance has date/employee summary support.</p></div><div class="card"><b>Employee Master</b><p class="muted">All employee selectors are populated from Staff / Users.</p></div><div class="card"><b>Countries</b><p class="muted">Countries are managed dynamically from the Countries module.</p></div><div class="card"><b>Phone / WhatsApp</b><p class="muted">Bangladesh numbers are converted automatically for WhatsApp links.</p></div></div>'}
function renderDuePayments(){current.module='Invoices';current.search='Unpaid';$('title').textContent='Due Payments';renderList()}
window.addEventListener('load',()=>{if(token&&user)start();else showLogin()});
</script>
