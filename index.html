<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiance Bangladesh CRM</title>
<style>
:root{--p:#6d28d9;--p2:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--danger:#dc2626;--ok:#059669}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#4c1d95,#2563eb)}.login-card{width:min(420px,100%);background:white;border-radius:22px;padding:32px;box-shadow:0 25px 70px #0004}.logo{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto 12px}.login-card h1{text-align:center;margin:5px 0}.sub{text-align:center;color:var(--muted);margin:0 0 25px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 11px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p2);box-shadow:0 0 0 3px #2563eb18}.btn{border:0;border-radius:10px;padding:10px 14px;background:#eef2ff;color:#27324a;font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.btn.success{background:#d1fae5;color:#065f46}.btn.small{padding:7px 9px;font-size:12px}.link{border:0;background:none;color:var(--p2);font-weight:700;padding:0}.app{display:flex;min-height:100vh}.sidebar{width:255px;background:#111827;color:#e5e7eb;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:10}.brand{padding:18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff12}.brand img{width:40px;height:40px;object-fit:contain}.brand strong{font-size:15px}.brand small{display:block;color:#9ca3af}.nav-group{padding:14px 10px 4px;color:#9ca3af;font-size:11px;font-weight:800;text-transform:uppercase}.nav{padding:6px 10px 14px}.nav button{width:100%;background:none;border:0;color:#d1d5db;text-align:left;padding:10px 12px;border-radius:9px;margin:1px 0}.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}.main{margin-left:255px;width:calc(100% - 255px);min-width:0}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:8}.topbar-left{display:flex;align-items:center;gap:10px}.page-title{font-size:20px;font-weight:800}.user-chip{font-size:13px;color:var(--muted)}.content{padding:22px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px}.metric{font-size:28px;font-weight:900;margin-top:8px}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{min-width:230px;padding:10px;border:1px solid var(--border);border-radius:10px}.table-wrap{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}.table th{background:#f8fafc;font-size:12px;position:sticky;top:0}.actions{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:800}.phone-btn{font-size:11px;margin-left:5px}.pager{display:flex;justify-content:space-between;align-items:center;padding:12px}.modal-back{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:#fff;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.span2{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px #0003}.empty{padding:45px;text-align:center;color:var(--muted)}.mobile-menu{display:none}.error{color:var(--danger);font-size:13px;margin:8px 0}.stat-note{margin-top:5px;font-size:11px;color:var(--muted)}
@media(max-width:850px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile-menu{display:inline-flex}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.content{padding:14px}.topbar{padding:0 14px}.search{min-width:180px}}
</style>
</head>
<body>
<div id="loginView" class="login"><div class="login-card">
<img class="logo" src="../logo.png" onerror="this.onerror=null;this.src='../assets/logo.png'">
<h1>Radiance Bangladesh CRM</h1><p class="sub">CRM & Business Management System</p>
<form id="loginForm"><div class="field"><label>Username or Email</label><input id="loginIdentifier" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required></div><button class="btn primary" style="width:100%">Login</button><div id="loginError" class="error"></div></form>
<div style="text-align:center;margin-top:15px"><button class="link" onclick="openForgot()">Forgot Password?</button></div>
</div></div>

<div id="appView" class="app hidden"><aside id="sidebar" class="sidebar"><div class="brand"><img src="../logo.png" onerror="this.onerror=null;this.src='../assets/logo.png'"><div><strong>Radiance Bangladesh</strong><small>CRM & BMS</small></div></div><div id="nav"></div></aside>
<main class="main"><header class="topbar"><div class="topbar-left"><button class="btn small mobile-menu" onclick="toggleSidebar()">☰</button><span id="pageTitle" class="page-title">Dashboard</span></div><div class="topbar-left"><button class="btn small" onclick="loadNotifications()">🔔 <span id="unread">0</span></button><span id="userChip" class="user-chip"></span><button class="btn small" onclick="logout()">Logout</button></div></header><section id="content" class="content"></section></main></div>

<div id="modalBack" class="modal-back hidden"><div id="modal" class="modal"></div></div><div id="toast" class="toast hidden"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxY1JlVa4vhxSQmJwI62WHHA_DkDXR2sYSYOr8thOtMqTMsH7oqsiEXUNMczh9zwW1Z/exec';
let state={token:localStorage.getItem('rb_token')||'',user:null,boot:null,module:null,page:1,search:'',rows:null,editId:null};
const $=id=>document.getElementById(id);
async function api(action,data={}){const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data,token:state.token})});const j=await res.json();if(!j.ok)throw new Error(j.error||'Request failed');return j.data;}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function wa(v){let n=String(v||'').replace(/\D/g,'');if(n.startsWith('0'))n='88'+n; if(n.startsWith('880'))return 'https://wa.me/'+n;return ''}
function toggleSidebar(){$('sidebar').classList.toggle('open')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{const d=await apiNoAuth('login',{identifier:$('loginIdentifier').value,password:$('loginPassword').value});state.token=d.token;state.user=d.user;localStorage.setItem('rb_token',state.token);await startApp()}catch(x){$('loginError').textContent=x.message}});
async function apiNoAuth(action,data={}){const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});const j=await res.json();if(!j.ok)throw new Error(j.error||'Request failed');return j.data}
async function startApp(){try{if(!state.user)state.user=(await api('me')).user;state.boot=await api('bootstrap');$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userChip').textContent=`${state.user['Full Name']} · ${state.user.Role}`;renderNav();openModule('dashboard')}catch(e){localStorage.removeItem('rb_token');state.token='';$('loginView').classList.remove('hidden');$('appView').classList.add('hidden')}}
function renderNav(){const groups={};state.boot.modules.forEach(m=>(groups[m.group]??=[]).push(m));$('nav').innerHTML=Object.entries(groups).map(([g,ms])=>`<div class="nav-group">${esc(g)}</div><div class="nav">${ms.map(m=>`<button data-key="${m.key}" onclick="openModule('${m.key}')">${esc(m.label)}</button>`).join('')}</div>`).join('')}
async function openModule(key){state.module=key;state.page=1;state.search='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));const m=state.boot.modules.find(x=>x.key===key);$('pageTitle').textContent=m?m.label:key;if(key==='dashboard'){await renderDashboard();return}if(key==='reports'){renderReports();return}if(key==='duepayments'){await renderDuePayments();return}renderList()}
async function renderDashboard(){const d=await api('dashboard');const labels={Leads:'Leads',Students:'Students',Applications:'Applications',PendingDocuments:'Pending Documents',Offers:'Offers',Visa:'Visa Cases',Invoices:'Invoices',DuePayments:'Due Payments',Users:'Employees',TodayAttendance:"Today's Attendance",PendingLeave:'Pending Leave',UnreadNotifications:'Unread Notifications'};const c=d.counts;$('content').innerHTML=`<div class="toolbar"><div><h2 style="margin:0 0 4px">Dashboard</h2><span class="muted">Welcome to Radiance Bangladesh CRM.</span></div><button class="btn primary" onclick="renderDashboard()">Refresh</button></div><div class="cards">${Object.entries(labels).map(([k,l])=>`<div class="card"><div class="muted">${l}</div><div class="metric">${c[k]??0}</div></div>`).join('')}</div><div style="margin-top:18px" class="card"><h3 style="margin-top:0">Recent Activity</h3>${d.recentActivity.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Module</th><th>Record</th><th>Details</th></tr></thead><tbody>${d.recentActivity.map(r=>`<tr><td>${esc(r['Date Time'])}</td><td>${esc(r.Username)}</td><td>${esc(r.Action)}</td><td>${esc(r.Module)}</td><td>${esc(r['Record ID'])}</td><td>${esc(r.Details)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No activity yet.</div>'}</div>`}
function renderReports(){$('content').innerHTML=`<div class="card"><h2>Reports</h2><p class="muted">Use module lists and dashboard metrics for live operational reporting. Export can be added later without changing the database structure.</p></div>`}
async function renderDuePayments(){const d=await api('list',{module:'invoices',page:1,pageSize:200,search:''});d.rows=d.rows.filter(r=>Number(r.Balance||0)>0&&String(r.Status)!=='Paid');renderData(d,'Due Payments',false)}
async function renderList(){const d=await api('list',{module:state.module,page:state.page,pageSize:50,search:state.search});state.rows=d;renderData(d);}
function canWrite(){return state.user?.Role==='Admin'||(state.boot.permissions||[]).includes(state.module)||((state.boot.permissions||[]).includes(state.module+':write'))}
function renderData(d,titleOverride,allowSearch=true){const headers=d.headers||[];let h=headers.filter(x=>x!=='Password Hash');if(state.module==='employees')h=h.filter(x=>x!=='Created At'&&x!=='Updated At');const canEdit=canWrite()&&!['notifications','activitylog'].includes(state.module);$('content').innerHTML=`<div class="toolbar"><div class="toolbar-left">${allowSearch?`<input id="searchBox" class="search" placeholder="Search..." value="${esc(state.search)}" onkeydown="if(event.key==='Enter'){state.search=this.value;state.page=1;renderList()}">`:''}</div><div class="toolbar-right">${canEdit?`<button class="btn primary" onclick="openForm()">+ Add ${esc(titleOverride||state.boot.modules.find(x=>x.key===state.module)?.label||'Record')}</button>`:''}<button class="btn" onclick="${state.module==='duepayments'?'renderDuePayments()':'renderList()'}">Refresh</button></div></div><div class="table-wrap"><table class="table"><thead><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}<th>Action</th></tr></thead><tbody>${d.rows.length?d.rows.map(r=>`<tr>${h.map(k=>`<td>${cell(k,r[k])}</td>`).join('')}<td><div class="actions">${canEdit?`<button class="btn small" onclick="openForm('${esc(r[headers[0]])}')">Edit</button><button class="btn small danger" onclick="removeRow('${esc(r[headers[0]])}')">Delete</button>`:state.module==='notifications'&&String(r['Is Read']).toLowerCase()!=='yes'?`<button class="btn small success" onclick="markRead('${esc(r['Notification ID'])}')">Mark Read</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="${h.length+1}"><div class="empty">No records found.</div></td></tr>`}</tbody></table></div><div class="pager"><span class="muted">${d.total} record(s) · Page ${d.page}/${d.totalPages}</span><div class="actions"><button class="btn small" ${d.page<=1?'disabled':''} onclick="state.page--;renderList()">Previous</button><button class="btn small" ${d.page>=d.totalPages?'disabled':''} onclick="state.page++;renderList()">Next</button></div></div>`}
function cell(k,v){if(k.toLowerCase().includes('phone')&&v){const u=wa(v);return `${esc(v)} ${u?`<a class="btn small phone-btn" target="_blank" href="${u}">WhatsApp</a>`:''}`}if(k.toLowerCase().includes('url')&&v)return `<a target="_blank" href="${esc(v)}">View</a>`;if(['Status','Application Status','Offer Type','Priority'].includes(k))return `<span class="badge">${esc(v)}</span>`;return esc(v)}
const FIELD_MAP={
Users:['Employee ID','Full Name','Username','Email','Phone','Role','Password','Photo'],
Leads:['Lead ID','Name','Phone','Email','Country','Source','Status','Assigned To','Notes'],
Students:['Student ID','Name','Phone','Email','DOB','Gender','Passport No','Country','Source','Lead ID','Assigned To','Status','Notes'],
Counselling:['Counselling ID','Student ID','Employee ID','Employee Name','Date','Country','University ID','Course ID','Notes','Next Follow Up'],
FollowUps:['Follow Up ID','Lead ID','Student ID','Employee ID','Employee Name','Date','Time','Type','Status','Notes'],
Tasks:['Task ID','Title','Description','Assigned To','Employee ID','Employee Name','Due Date','Priority','Status','Remarks'],
EmployeeAttendance:['Attendance ID','Employee ID','Employee Name','Date','Check In','Check Out','Status','Remarks','Marked By'],
LeaveManagement:['Leave ID','Employee ID','Employee Name','Leave Type','Start Date','End Date','Total Days','Reason','Status','Approved By','Remarks'],
Countries:['Country ID','Country Name','Status'],Universities:['University ID','University Name','Country','Country ID','Status'],
Courses:['Course ID','University ID','Course Name','Level','Intake','Tuition Fee','Status'],
Intake:['Intake ID','Country','University ID','Course ID','Intake Name','Start Date','Deadline','Status','Notes'],
Applications:['Application ID','Student ID','Country','University ID','Course ID','Intake','Application Date','Application Status','Assigned To','Employee ID','Employee Name','Notes'],
Documents:['Document ID','Student ID','Document Name','Requirement','Received','Verified','File URL','Notes','Uploaded By'],
DocumentChecklist:['Checklist ID','Student ID','Document Name','Required','Received','Verified','Remarks','Checked By'],
Offers:['Offer ID','Application ID','Student ID','University ID','Course ID','Offer Type','Offer Date','Deadline','Status','Notes'],
Visa:['Visa ID','Application ID','Student ID','Country','Visa Type','Submission Date','Decision Date','Status','Employee ID','Employee Name','Notes'],
IELTS_Batches:['Batch ID','Batch Name','Teacher','Employee ID','Employee Name','Start Date','End Date','Schedule','Status','Fee'],
IELTS_Students:['IELTS Student ID','Student ID','Batch ID','Employee ID','Employee Name','Enrollment Date','Status','Notes'],
IELTS_Attendance:['IELTS Attendance ID','IELTS Student ID','Batch ID','Student ID','Date','Status','Marked By','Remarks'],
IELTS_MockTests:['Mock Test ID','IELTS Student ID','Student ID','Test Date','Listening','Reading','Writing','Speaking','Overall','Remarks','Marked By'],
IELTS_Results:['Result ID','IELTS Student ID','Student ID','Test Date','Listening','Reading','Writing','Speaking','Overall','TRF No','Remarks','Marked By'],
Payments:['Payment ID','Student ID','Invoice ID','Amount','Payment Date','Method','Reference','Received By','Notes'],
Invoices:['Invoice ID','Student ID','Invoice Date','Due Date','Description','Amount','Paid Amount','Balance','Status'],
MoneyReceipts:['Receipt ID','Student ID','Invoice ID','Amount','Receipt Date','Payment Method','Received By','Reference','Notes'],
Income:['Income ID','Category','Description','Amount','Income Date','Received By','Payment Method','Reference','Notes'],
Expenses:['Expense ID','Category','Description','Amount','Expense Date','Paid By','Payment Method','Reference','Notes'],
Notifications:['Notification ID','Title','Message','Type','For Employee ID','Is Read'],
Timeline:['Timeline ID','Student ID','Date','Type','Title','Description','Created By'],
LeadSources:['Source ID','Source Name','Status','Notes'],
StudentPortal:['Portal ID','Student ID','Username','Password','Last Login','Status'],
Roles:['Role ID','Role Name','Permissions'],Settings:['Key','Value'],ActivityLog:['Log ID','Date Time','Username','Employee ID','Action','Module','Record ID','Details']
};
function fieldsFor(){
  const sh=state.module==='employees'?'Users':({'attendance':'EmployeeAttendance','leave':'LeaveManagement','batches':'IELTS_Batches','ieltsstudents':'IELTS_Students','ieltsattendance':'IELTS_Attendance','mocktests':'IELTS_MockTests','results':'IELTS_Results','moneyreceipts':'MoneyReceipts','checklist':'DocumentChecklist','followups':'FollowUps','activitylog':'ActivityLog','studentportal':'StudentPortal','leadsources':'LeadSources','duepayments':'Invoices','reports':'Reports'}[state.module]||state.module.charAt(0).toUpperCase()+state.module.slice(1));
  return FIELD_MAP[sh]||[];
}
function openForm(id=''){state.editId=id;const fs=fieldsFor();let old={};if(id&&state.rows)old=state.rows.rows.find(r=>String(r[state.rows.headers[0]])===String(id))||{};const noEditIds=['Attendance ID','Leave ID','Country ID','University ID','Course ID','Application ID','Document ID','Checklist ID','Offer ID','Visa ID','Batch ID','IELTS Student ID','IELTS Attendance ID','Mock Test ID','Result ID','Payment ID','Invoice ID','Receipt ID','Expense ID','Income ID','Timeline ID','Source ID','Notification ID'];$('modal').innerHTML=`<div class="modal-head"><h3>${id?'Edit':'Add'} ${esc(state.boot.modules.find(x=>x.key===state.module)?.label||'Record')}</h3><button class="btn small" onclick="closeModal()">✕</button></div><form id="recordForm"><div class="form-grid">${fs.map(f=>fieldHtml(f,old[f]??'',noEditIds.includes(f))).join('')}</div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`;$('modalBack').classList.remove('hidden');$('recordForm').onsubmit=saveForm}
function selectOpts(field,val){if(field==='Role')return state.boot.roles.map(x=>`<option ${String(val)===x.name?'selected':''}>${esc(x.name)}</option>`).join('');if(field.includes('Employee')||['Assigned To','Counsellor','Teacher','Received By','Paid By','Approved By','Marked By','Checked By','Created By','Uploaded By'].includes(field))return state.boot.employees.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id||String(val)===x.label?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Country')return state.boot.countries.map(x=>`<option value="${esc(x.name)}" ${String(val)===x.name||String(val)===x.label?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Country ID')return state.boot.countries.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='University ID')return state.boot.universities.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Course ID')return state.boot.courses.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Student ID')return state.boot.students.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Lead ID')return state.boot.leads.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Application ID')return state.boot.applications.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Invoice ID')return state.boot.invoices.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');if(field==='Batch ID')return state.boot.batches.map(x=>`<option value="${esc(x.id)}" ${String(val)===x.id?'selected':''}>${esc(x.label)}</option>`).join('');return null}
function fieldHtml(f,val,disabled){let type='text',extra='';if(/Date$|^Date$|Date Time/.test(f)||['DOB','Start Date','End Date','Due Date','Deadline','Application Date','Offer Date','Submission Date','Decision Date','Enrollment Date','Test Date'].includes(f))type='date';if(['Password','Password Hash'].includes(f))type='password';if(['Notes','Description','Reason','Remarks','Message'].includes(f))type='textarea';if(['Amount','Paid Amount','Balance','Fee','Tuition Fee','Total Days','Listening','Reading','Writing','Speaking','Overall'].includes(f))type='number';const sel=selectOpts(f,val);if(sel!==null)extra=`<select id="f_${css(f)}" name="${esc(f)}"><option value="">Select...</option>${sel}</select>`;else if(type==='textarea')extra=`<textarea id="f_${css(f)}" name="${esc(f)}">${esc(val)}</textarea>`;else extra=`<input id="f_${css(f)}" name="${esc(f)}" type="${type}" value="${type==='date'?dateVal(val):esc(val)}" ${disabled?'disabled':''}>`;return `<div class="field"><label>${esc(f)}${disabled?' (Auto)':''}</label>${extra}</div>`}
function css(s){return s.replace(/[^a-zA-Z0-9]/g,'_')};function dateVal(v){const s=String(v||'');return s.length>=10?s.slice(0,10):''}
async function saveForm(e){e.preventDefault();const r={};new FormData(e.target).forEach((v,k)=>{r[k]=v});try{await api('save',{module:state.module,recordId:state.editId,record:r});closeModal();toast('Saved successfully');state.boot=await api('bootstrap');if(state.module==='employees')renderNav();await renderList()}catch(x){toast(x.message)}}
async function removeRow(id){if(!confirm('Delete this record?'))return;try{await api('delete',{module:state.module,recordId:id});toast('Deleted successfully');state.boot=await api('bootstrap');await renderList()}catch(x){toast(x.message)}}
async function markRead(id){try{await api('markNotificationRead',{recordId:id});toast('Notification marked read');await renderList();updateUnread()}catch(e){toast(e.message)}}
function closeModal(){$('modalBack').classList.add('hidden')}
function openForgot(){$('modal').innerHTML=`<div class="modal-head"><h3>Password Reset</h3><button class="btn small" onclick="closeModal()">✕</button></div><div id="forgotStep"><div class="field"><label>Username or registered email</label><input id="fpIdentifier"></div><button class="btn primary" onclick="sendOtp()">Send OTP</button></div>`;$('modalBack').classList.remove('hidden')}
async function sendOtp(){try{const d=await apiNoAuth('forgotPassword',{identifier:$('fpIdentifier').value});$('modal').innerHTML=`<div class="modal-head"><h3>Enter OTP</h3></div><p class="muted">${esc(d.message)}</p><div class="field"><label>OTP</label><input id="otp"></div><div class="field"><label>New Password</label><input id="np" type="password"></div><div class="field"><label>Confirm Password</label><input id="cp" type="password"></div><button class="btn primary" onclick="resetPw('${esc(d.resetToken||'')}')">Reset Password</button>`}catch(e){toast(e.message)}}
async function resetPw(t){if($('np').value!==$('cp').value)return toast('Passwords do not match.');try{const d=await apiNoAuth('resetPassword',{resetToken:t,otp:$('otp').value,newPassword:$('np').value});closeModal();toast(d.message)}catch(e){toast(e.message)}}
async function loadNotifications(){if(!state.token)return;try{await updateUnread();openModule('notifications')}catch(e){toast(e.message)}}
async function updateUnread(){const d=await api('list',{module:'notifications',page:1,pageSize:200});$('unread').textContent=d.rows.filter(r=>String(r['Is Read']).toLowerCase()!=='yes').length}
async function logout(){try{await api('logout',{});}catch(e){}localStorage.removeItem('rb_token');location.reload()}
if(state.token)startApp();
</script></body></html>
