<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radiance Bangladesh CRM</title><style>
:root{--p:#6d28d9;--b:#2563eb;--bg:#f5f7fb;--bd:#e5e7eb}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--b));padding:20px}.loginbox{background:#fff;width:min(420px,100%);padding:30px;border-radius:20px;box-shadow:0 20px 50px #0003;text-align:center}.loginbox img{width:90px;height:90px;object-fit:contain}.loginbox input{display:block;width:100%;padding:11px;margin:10px 0;border:1px solid var(--bd);border-radius:8px}.primary{background:var(--p);color:white;padding:10px 15px;border-radius:8px}.secondary{background:#eef2ff;color:#3730a3;padding:8px 12px;border-radius:7px}.danger{background:#fee2e2;color:#991b1b;padding:7px 10px;border-radius:7px}.app{min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:235px;background:#111827;color:#fff;padding:16px 10px;overflow:auto}.side h2{font-size:18px;margin:5px 10px}.side small{display:block;color:#9ca3af;margin:0 10px 15px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d1d5db;padding:9px 11px;border-radius:7px;margin:2px 0}.nav button.active,.nav button:hover{background:#312e81;color:#fff}.main{margin-left:235px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0}.user{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.card{background:#fff;border:1px solid var(--bd);border-radius:13px;padding:16px}.stat b{display:block;font-size:26px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{padding:9px;border:1px solid var(--bd);border-radius:8px}.tablewrap{overflow:auto;border:1px solid var(--bd);border-radius:9px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font-size:12px}.table th{background:#f8fafc}.actions{display:flex;gap:5px}.wa{background:#dcfce7;color:#166534;padding:5px;border-radius:5px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:10}.modalbox{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:7px}.field textarea{min-height:75px}.full{grid-column:1/-1}.photo{width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:6px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 15px;border-radius:8px;z-index:30}.pager{display:flex;justify-content:space-between;padding-top:12px}@media(max-width:800px){.side{position:relative;width:100%;height:auto}.main{margin-left:0}.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.formgrid{grid-template-columns:1fr}.top{display:block}.user{margin-top:10px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><img src="./logo.png" onerror="this.onerror=null;this.src='./assets/logo.png'"><h2>Radiance Bangladesh CRM</h2><p>CRM & Business Management System</p><input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="primary" style="width:100%" onclick="login()">Login</button></div></div>
<div id="app" class="app hidden"><aside class="side"><h2>Radiance Bangladesh</h2><small>CRM & Business Management System</small><div id="nav" class="nav"></div><button style="width:100%;margin-top:15px;padding:9px;border-radius:7px" onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span style="color:#6b7280">Welcome to Radiance Bangladesh</span></div><div class="user"><img id="up" class="avatar" src="./logo.png"><span id="un"></span></div></div><div id="content"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxY1JlVa4vhxSQmJwI62WHHA_DkDXR2sYSYOr8thOtMqTMsH7oqsiEXUNMczh9zwW1Z/exec';let token=sessionStorage.getItem('radiance_token')||'',user=JSON.parse(sessionStorage.getItem('radiance_user')||'null'),dd=null,cache={};
const MOD=[['Dashboard','Dashboard'],['Leads','Leads'],['Students','Students'],['Counselling','Counselling'],['FollowUps','Follow Ups'],['Tasks','Tasks'],['EmployeeAttendance','Employee Attendance'],['LeaveManagement','Leave Management'],['IELTS_Batches','IELTS Batches'],['IELTS_Students','IELTS Students'],['IELTS_Attendance','IELTS Attendance'],['IELTS_MockTests','IELTS Mock Tests'],['IELTS_Results','IELTS Results'],['Countries','Countries'],['Universities','Universities'],['Courses','Courses'],['Intake','Intake'],['Applications','Applications'],['Documents','Documents'],['DocumentChecklist','Document Checklist'],['Offers','Offers'],['Visa','Visa'],['Payments','Payments'],['Invoices','Invoices'],['MoneyReceipts','Money Receipts'],['Income','Income'],['Expenses','Expenses'],['DuePayments','Due Payments'],['Reports','Reports'],['StudentPortal','Student Portal'],['Notifications','Notifications'],['Timeline','Timeline'],['LeadSources','Lead Sources'],['Users','Staff / Users'],['Roles','Roles'],['ActivityLog','Activity Log'],['Settings','Settings']];let cur={module:'Dashboard',page:1,size:20,search:'',rows:[],total:0,headers:[]};
function api(action,o={}){return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...o})}).then(r=>r.json()).then(x=>{if(!x.ok)throw Error(x.error||'Request failed');return x})}function login(){api('login',{username:gid('lu').value,password:gid('lp').value}).then(x=>{token=x.token;user=x.user;sessionStorage.setItem('radiance_token',token);sessionStorage.setItem('radiance_user',JSON.stringify(user));start()}).catch(e=>toast(e.message,true))}function start(){if(!token||!user)return;gid('login').classList.add('hidden');gid('app').classList.remove('hidden');gid('un').textContent=(user.name||'')+' • '+user.role;if(user.photo)gid('up').src=user.photo;nav();open('Dashboard')}
function nav(){const n=gid('nav');n.innerHTML='';MOD.forEach(x=>{if(user.role!=='Admin'&&['Users','Roles','Settings','ActivityLog'].includes(x[0]))return;let b=document.createElement('button');b.textContent=x[1];b.dataset.m=x[0];b.onclick=()=>open(x[0]);n.appendChild(b)})}function open(m){cur={module:m,page:1,size:20,search:'',rows:[],total:0,headers:[]};gid('title').textContent=label(m);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.m===m));if(m==='Dashboard')return dash();if(m==='Reports')return reports();if(m==='DuePayments'){cur.module='Invoices';cur.search='Unpaid'};loadDD().then(list).catch(e=>toast(e.message,true))}function label(m){return(MOD.find(x=>x[0]===m)||[m,m])[1]}function loadDD(){if(dd)return Promise.resolve(dd);return api('dropdowns').then(x=>dd=x.data)}
function list(){const k=cur.module+'|'+cur.page+'|'+cur.search;if(cache[k]){Object.assign(cur,cache[k]);return draw()}return api('list',{module:cur.module,page:cur.page,pageSize:cur.size,search:cur.search}).then(x=>{Object.assign(cur,x);cache[k]={headers:x.headers,rows:x.rows,total:x.total,page:x.page};draw()})}function draw(){let h=cur.headers,r=cur.rows;gid('content').innerHTML='<div class="card"><div class="toolbar"><input id="search" placeholder="Search..." value="'+esc(cur.search)+'"><button class="secondary" onclick="searchNow()">Search</button><button class="secondary" onclick="refresh()">Refresh</button>'+canWrite(cur.module)?'<button class="primary" onclick="form()">+ Add New</button>':''+'</div><div class="tablewrap"><table class="table"><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+(r.length?r.map(row=>'<tr>'+h.map(x=>'<td>'+cell(x,row[x])+'</td>').join('')+'<td class="actions">'+(canWrite(cur.module)?'<button class="secondary" onclick=\'form('+JSON.stringify(row)+')\'>Edit</button><button class="danger" onclick="del(\''+attr(row[h[0]])+'\')">Delete</button>':'-')+'</td></tr>').join(''):'<tr><td colspan="'+(h.length+1)+'" style="text-align:center;padding:25px">No records found</td></tr>')+'</tbody></table></div><div class="pager"><span>'+cur.total+' records</span><span><button class="secondary" onclick="page(-1)" '+(cur.page<=1?'disabled':'')+'>Previous</button> Page '+cur.page+' <button class="secondary" onclick="page(1)" '+(cur.page*cur.size>=cur.total?'disabled':'')+'>Next</button></span></div></div>'}function searchNow(){cur.search=gid('search').value;cur.page=1;list()}function refresh(){cache={};dd=null;loadDD().then(list)}function page(x){cur.page+=x;list()}function canWrite(m){return !['Dashboard','Reports','DuePayments','ActivityLog'].includes(m)}
function cell(h,v){let s=String(v??'');if(phone(h)&&s)return esc(s)+' <button class="wa" onclick="wa(\''+attr(s)+'\')">WhatsApp</button>';if(/^https?:\/\//i.test(s))return '<a href="'+attr(s)+'" target="_blank">Open</a>';return esc(s)}function phone(h){return['Phone','WhatsApp','Mobile','Contact','Phone Number','Mobile Number'].includes(h)}function wa(s){let n=s.replace(/\D/g,'');if(n.startsWith('01')&&n.length===11)n='880'+n.slice(1);else if(n.startsWith('00880'))n=n.slice(2);window.open('https://wa.me/'+n,'_blank')}
function form(row={}){let h=Object.keys(row).length?Object.keys(row):guess(cur.module),auto=isAuto(cur.module,h[0]);let html='<div class="modalbox"><div style="display:flex;justify-content:space-between"><h2>'+(row[h[0]]?'Edit ':'Add ')+label(cur.module)+'</h2><button onclick="closeM()">✕</button></div><form id="rf"><div class="formgrid">';h.forEach(k=>{if(['Password Hash','Created At','Updated At'].includes(k))return;if(auto&&k===h[0]&&!row[k])return;html+=field(k,row[k]??'')});html+='</div><div style="text-align:right;margin-top:15px"><button type="button" class="secondary" onclick="closeM()">Cancel</button> <button class="primary">Save</button></div></form></div>';gid('modal').innerHTML=html;gid('modal').classList.remove('hidden');gid('rf').onsubmit=e=>{e.preventDefault();save(row,h)}}
function guess(m){const a={Users:['Employee ID','Full Name','Username','Email','Phone','Role','Password','Photo']};return a[m]||[]}
const AUTO=['Leads','Students','Counselling','FollowUps','Tasks','Countries','Universities','Courses','Applications','Documents','DocumentChecklist','Offers','Visa','IELTS_Batches','IELTS_Students','IELTS_Attendance','IELTS_MockTests','IELTS_Results','Payments','Expenses','Invoices','MoneyReceipts','Notifications','ActivityLog','Intake','Income','Timeline','LeadSources','StudentPortal','EmployeeAttendance','LeaveManagement'];function isAuto(m,h){return AUTO.includes(m)&&/ID$/i.test(h)}
function field(k,v){let id='f_'+slug(k);if(k==='Photo'&&cur.module==='Users')return '<div class="field"><label>Photo</label><input id="'+id+'" type="file" accept="image/*" onchange="pv(this)"><img id="photoPreview" class="photo" src="'+attr(v||'./logo.png')+'"></div>';if(cur.module==='EmployeeAttendance'&&k==='Status')return select(id,k,v,['Present','Absent','Late','Half Day','Leave']);if(cur.module==='LeaveManagement'&&k==='Status')return select(id,k,v,['Pending','Approved','Rejected','Cancelled']);if(k==='Role')return select(id,k,v,dd.roles);if(emp(k))return empSelect(k,v,id);if(k==='Student ID')return master(id,k,v,dd.students);if(k==='Lead ID')return master(id,k,v,dd.leads);if(k==='Invoice ID')return master(id,k,v,dd.invoices);if(k==='Application ID')return master(id,k,v,dd.applications);if(k==='Batch ID')return master(id,k,v,dd.batches);if(k==='University ID')return master(id,k,v,dd.universities);if(k==='Course ID')return master(id,k,v,dd.courses);if(k==='Country'||k==='Country ID')return master(id,k,v,dd.countries);if(/password/i.test(k))return '<div class="field"><label>'+esc(k)+'</label><input id="'+id+'" type="password"></div>';if(/date/i.test(k))return '<div class="field"><label>'+esc(k)+'</label><input id="'+id+'" type="date" value="'+date(v)+'"></div>';if(/time/i.test(k)||k==='Check In'||k==='Check Out')return '<div class="field"><label>'+esc(k)+'</label><input id="'+id+'" type="time" value="'+time(v)+'"></div>';if(/amount|fee|balance|days|capacity|overall|listening|reading|writing|speaking/i.test(k))return '<div class="field"><label>'+esc(k)+'</label><input id="'+id+'" type="number" step="any" value="'+attr(v)+'"></div>';if(/description|notes|remarks|reason|message|address|requirement/i.test(k))return '<div class="field full"><label>'+esc(k)+'</label><textarea id="'+id+'">'+esc(v)+'</textarea></div>';if(['Status','Priority','Method','Gender','Level','Type'].includes(k))return select(id,k,v,opts(k));return '<div class="field"><label>'+esc(k)+'</label><input id="'+id+'" value="'+attr(v)+'"></div>'}
function emp(k){return['Employee ID','Employee Name','Employee','Staff ID','Staff Name','Teacher ID','Teacher','Assigned Employee','Assigned To','Counsellor','Received By','Paid By','Marked By','Approved By'].includes(k)}function empSelect(k,v,id){let name=/Name|Employee$|Staff Name|Teacher$|Received By|Paid By|Marked By|Approved By/.test(k),o=dd.employees||[];return select(id,k,v,o.map(x=>({name:name?x.name:x.id,label:name?x.name+' — '+x.id:x.id+' — '+x.name,value:name?x.name:x.id})),()=>syncEmp(this.id,name?'name':'id'))}function syncEmp(id,type){let x=dd.employees.find(a=>(type==='id'?a.id:a.name)===gid(id).value);if(!x)return;['Employee ID','Staff ID','Teacher ID'].forEach(k=>{let e=gid('f_'+slug(k));if(e)e.value=x.id});['Employee Name','Staff Name','Employee','Staff Name','Teacher','Received By','Paid By','Marked By','Approved By'].forEach(k=>{let e=gid('f_'+slug(k));if(e)e.value=x.name});}
function master(id,k,v,a){return select(id,k,v,(a||[]).map(x=>({name:x.name,label:x.id+' — '+x.name,value:x.id})))}function select(id,k,v,a,fn){return '<div class="field"><label>'+esc(k)+'</label><select id="'+id+'" '+(fn?'onchange="'+fn.toString().replace(/"/g,'&quot;')+'"':'')+'><option value="">Select '+esc(k)+'</option>'+(a||[]).map(x=>{let value=typeof x==='string'?x:(x.value??x.name),label=typeof x==='string'?x:(x.label??x.name);return '<option value="'+attr(value)+'" '+(String(v)===String(value)?'selected':'')+'>'+esc(label)+'</option>'}).join('')+'</select></div>'}function opts(k){if(k==='Status')return['Active','Inactive'];if(k==='Priority')return['Low','Medium','High','Urgent'];if(k==='Method')return['Cash','bKash','Nagad','Rocket','Bank','Card'];if(k==='Gender')return['Male','Female','Other'];if(k==='Level')return['Beginner','Intermediate','Advanced'];if(k==='Type')return['Phone','Email','WhatsApp','Meeting','Other'];return[]}
async function save(row,h){try{let d={};h.forEach(k=>{if(['Password Hash','Created At','Updated At'].includes(k))return;let e=gid('f_'+slug(k));if(e)d[k]=e.type==='file'?'':e.value});if(cur.module==='EmployeeAttendance')d['Marked By']=user.name;if(cur.module==='Users'){let f=gid('f_Photo');if(f&&f.files[0]){let x=f.files[0],b=await b64(x),up=await api('uploadPhoto',{file:{name:'staff-'+d['Employee ID']+'-'+Date.now()+'.jpg',mimeType:x.type,base64:b}});d.Photo=up.url}else if(row.Photo)d.Photo=row.Photo}await api('save',{module:cur.module,data:d});toast('Saved successfully');closeM();cache={};dd=null;await loadDD();list()}catch(e){toast(e.message,true)}}function b64(f){return new Promise((r,j)=>{let x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.onerror=j;x.readAsDataURL(f)})}function pv(i){if(i.files[0])gid('photoPreview').src=URL.createObjectURL(i.files[0])}async function del(id){if(!confirm('Delete this record?'))return;try{await api('delete',{module:cur.module,id});toast('Deleted');refresh()}catch(e){toast(e.message,true)}}
function dash(){api('dashboard').then(x=>{gid('content').innerHTML='<div class="grid">'+Object.entries(x.data.counts).map(a=>'<div class="stat">'+esc(label(a[0]))+'<b>'+a[1]+'</b></div>').join('')+'</div><div class="card" style="margin-top:15px">Employee selectors throughout the CRM use the Staff / Users master list.</div>'}).catch(e=>toast(e.message,true))}function reports(){api('reports').then(x=>{let d=x.data;gid('content').innerHTML='<div class="grid">'+[['Invoice Total',d.invoiceTotal],['Payments',d.paymentTotal],['Expenses',d.expenseTotal],['Employees',d.employees]].map(a=>'<div class="stat">'+a[0]+'<b>'+a[1]+'</b></div>').join('')+'</div>'}).catch(e=>toast(e.message,true))}function closeM(){gid('modal').classList.add('hidden');gid('modal').innerHTML=''}function gid(x){return document.getElementById(x)}function slug(x){return String(x).replace(/[^a-zA-Z0-9]+/g,'_')}function date(v){return String(v||'').match(/^\d{4}-\d{2}-\d{2}/)?.[0]||''}function time(v){return String(v||'').match(/\b(\d{2}:\d{2})/)?.[1]||''}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(x){return esc(x)}function toast(s,e){let t=gid('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}function logout(){api('logout').finally(()=>{sessionStorage.clear();location.reload()})}if(token&&user)start();
</script></body></html>
