<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Radiance Bangladesh CRM</title>

<style>

:root{
  --primary:#6d28d9;
  --secondary:#4f46e5;
  --dark:#111827;
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --border:#e5e7eb;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#d97706;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.login-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(
    135deg,
    #eef2ff,
    #faf5ff
  );
}

.login-box{
  width:min(410px,92%);
  background:#fff;
  padding:32px;
  border-radius:16px;
  box-shadow:0 20px 60px #0002;
}

.login-logo{
  display:block;
  width:90px;
  height:90px;
  object-fit:contain;
  margin:auto auto 15px;
}

.login-box h2{
  text-align:center;
  margin:0;
}

.login-box p{
  text-align:center;
  color:var(--muted);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  background:#fff;
}

.field textarea{
  min-height:85px;
  resize:vertical;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  background:var(--primary);
  color:#fff;
}

.btn-light{
  background:#fff;
  color:var(--text);
  border:1px solid var(--border);
}

.btn-danger{
  background:var(--danger);
}

.btn-success{
  background:var(--success);
}

.btn-warning{
  background:var(--warning);
}

.app{
  min-height:100vh;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:#111827;
  color:#fff;
  overflow-y:auto;
  z-index:100;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  padding:16px;
  border-bottom:1px solid #273043;
}

.brand img{
  width:45px;
  height:45px;
  object-fit:contain;
  background:#fff;
  border-radius:8px;
  padding:4px;
}

.brand-title{
  font-size:15px;
  font-weight:bold;
}

.brand-sub{
  color:#9ca3af;
  font-size:11px;
}

.nav-group{
  color:#8b95a7;
  font-size:10px;
  padding:14px 12px 5px;
  text-transform:uppercase;
}

.nav-btn{
  display:block;
  width:calc(100% - 16px);
  margin:2px 8px;
  border:0;
  background:transparent;
  color:#cbd5e1;
  padding:10px 12px;
  text-align:left;
  border-radius:8px;
}

.nav-btn:hover,
.nav-btn.active{
  background:#293244;
  color:#fff;
}

.main{
  margin-left:250px;
  padding:18px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:10px;
}

.topbar h1{
  font-size:23px;
  margin:0;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.user-info{
  font-size:13px;
  color:var(--muted);
}

.menu-btn{
  display:none;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.stat small{
  color:var(--muted);
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:7px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.table-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.search{
  width:300px;
  max-width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
}

.table-wrap{
  overflow:auto;
  max-height:70vh;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:900px;
}

th,
td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
  white-space:nowrap;
}

th{
  position:sticky;
  top:0;
  background:#f8fafc;
  z-index:2;
}

.badge{
  padding:4px 8px;
  border-radius:30px;
  background:#eef2ff;
  font-size:11px;
}

.actions{
  display:flex;
  gap:5px;
}

.whatsapp{
  background:#16a34a;
  color:#fff;
  border:0;
  border-radius:5px;
  padding:4px 7px;
  font-size:11px;
}

.empty{
  padding:45px;
  text-align:center;
  color:var(--muted);
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:200;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(950px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
}

.loading{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:#fff9;
  z-index:500;
}

.loading.show{
  display:grid;
}

.loading-box{
  background:#fff;
  padding:18px 25px;
  border-radius:10px;
  box-shadow:0 10px 40px #0002;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  padding:12px 17px;
  background:#111827;
  color:#fff;
  border-radius:8px;
  display:none;
  z-index:600;
}

.toast.show{
  display:block;
}

.report-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

@media(max-width:1000px){

  .dashboard{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:700px){

  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:12px;
  }

  .menu-btn{
    display:inline-block;
  }

  .user-info{
    display:none;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .dashboard{
    grid-template-columns:1fr 1fr;
  }

  .report-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>


<!-- ======================================================
     LOGIN
====================================================== -->

<div
  id="loginScreen"
  class="login-screen"
>

  <div class="login-box">

    <img
      src="./logo.png"
      class="login-logo"
      alt="Radiance Bangladesh"
      onerror="this.style.display='none'"
    >

    <h2>
      Radiance Bangladesh
    </h2>

    <p>
      CRM & Business Management System
    </p>


    <div class="field">

      <label>
        Username
      </label>

      <input
        id="loginUsername"
        autocomplete="username"
      >

    </div>


    <div class="field">

      <label>
        Password
      </label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()"
      >

    </div>


    <button
      class="btn"
      style="width:100%"
      onclick="login()"
    >
      Login
    </button>


    <div
      id="loginError"
      style="color:#dc2626;text-align:center;margin-top:10px"
    ></div>

  </div>

</div>


<!-- ======================================================
     APPLICATION
====================================================== -->

<div
  id="app"
  style="display:none"
>

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="brand">

      <img
        src="./logo.png"
        alt="Radiance"
        onerror="this.style.display='none'"
      >

      <div>

        <div class="brand-title">
          Radiance Bangladesh
        </div>

        <div class="brand-sub">
          CRM / BMS
        </div>

      </div>

    </div>


    <div id="navigation"></div>

  </aside>


  <main class="main">

    <div class="topbar">

      <div
        style="display:flex;align-items:center;gap:10px"
      >

        <button
          class="btn btn-light menu-btn"
          onclick="toggleSidebar()"
        >
          ☰
        </button>

        <h1 id="pageTitle">
          Dashboard
        </h1>

      </div>


      <div class="top-actions">

        <span
          id="userInfo"
          class="user-info"
        ></span>

        <button
          class="btn btn-light"
          onclick="refresh()"
        >
          Refresh
        </button>

        <button
          class="btn btn-danger"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>


    <div id="content"></div>

  </main>

</div>


<!-- ======================================================
     MODAL
====================================================== -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Record
      </h2>

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        Close
      </button>

    </div>


    <div
      id="form"
      class="form-grid"
    ></div>


    <div
      style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"
    >

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="btn"
        onclick="saveRecord()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- LOADING -->

<div
  id="loading"
  class="loading"
>

  <div class="loading-box">
    Please wait…
  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
></div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxY1JlVa4vhxSQmJwI62WHHA_DkDXR2sYSYOr8thOtMqTMsH7oqsiEXUNMczh9zwW1Z/exec";


/* =========================================================
   MODULE NAMES
========================================================= */

const MODULES = {

  "CRM":[
    "Dashboard",
    "Leads",
    "Students",
    "Counselling",
    "FollowUps",
    "Tasks"
  ],

  "Staff Management":[
    "Users",
    "EmployeeAttendance",
    "LeaveManagement"
  ],

  "Study Abroad":[
    "Countries",
    "Universities",
    "Courses",
    "Intake",
    "Applications",
    "Documents",
    "DocumentChecklist",
    "Offers",
    "Visa"
  ],

  "IELTS":[
    "IELTS_Batches",
    "IELTS_Students",
    "IELTS_Attendance",
    "IELTS_MockTests",
    "IELTS_Results"
  ],

  "Accounts":[
    "Payments",
    "Invoices",
    "MoneyReceipts",
    "Income",
    "Expenses",
    "DuePayments",
    "Reports"
  ],

  "Administration":[
    "Roles",
    "Notifications",
    "Timeline",
    "LeadSources",
    "ActivityLog",
    "Settings",
    "StudentPortal"
  ]

};


const LABELS = {

  FollowUps:"Follow-ups",

  EmployeeAttendance:
    "Employee Attendance",

  LeaveManagement:
    "Leave Management",

  IELTS_Batches:
    "IELTS Batches",

  IELTS_Students:
    "IELTS Students",

  IELTS_Attendance:
    "IELTS Attendance",

  IELTS_MockTests:
    "IELTS Mock Tests",

  IELTS_Results:
    "IELTS Results",

  DocumentChecklist:
    "Document Checklist",

  MoneyReceipts:
    "Money Receipts",

  DuePayments:
    "Due Payments",

  LeadSources:
    "Lead Sources",

  StudentPortal:
    "Student Portal",

  ActivityLog:
    "Activity Log"

};


/* =========================================================
   FRONTEND SCHEMAS
========================================================= */

const HEADERS = {

Users:[
"Name","Email","Phone","Role","Username","Password","Status","Profile Photo"
],

Leads:[
"Lead Date","Name","Phone","WhatsApp","Email","Source",
"Interested Country","Interested Course","Intake",
"Assigned Counsellor","Priority","Status","Next Follow-up","Notes"
],

Students:[
"Lead ID","Name","Phone","WhatsApp","Email","Date of Birth",
"Gender","Address","Passport Number","Passport Issue Date",
"Passport Expiry Date","Nationality","Marital Status",
"SSC/O-Level","SSC/O-Level GPA","SSC/O-Level Passing Year",
"HSC/A-Level","HSC/A-Level GPA","HSC/A-Level Passing Year",
"Bachelor","Bachelor CGPA","Bachelor Passing Year",
"Master","Master CGPA","Master Passing Year",
"English Test","Overall Score","Listening","Reading","Writing",
"Speaking","Test Date","Preferred Country",
"Preferred University","Preferred Course","Preferred Intake",
"Budget","Assigned Counsellor","Current Status","Notes"
],

Countries:[
"Country Name","Country Code","Flag","Description","Status","Sort Order"
],

Universities:[
"University Name","Country","City","Website","Ranking",
"Application Fee","Tuition Fee","Intakes",
"IELTS Requirement","PTE Requirement","Duolingo Requirement",
"GPA Requirement","Scholarship","Processing Time",
"Partner Status","Status","Notes"
],

Courses:[
"University ID","University Name","Country","Course Name",
"Degree Level","Duration","Tuition Fee","Intake",
"IELTS Requirement","PTE Requirement",
"Duolingo Requirement","Application Deadline","Status","Notes"
],

Applications:[
"Student ID","Country","University","Course","Degree Level",
"Intake","Application Date","Application Deadline",
"Assigned Officer","Application Status","Application Fee",
"Payment Status","Notes"
],

"Expiry Date","Notes"
],

DocumentChecklist:[

"Required","Received","Verified","File URL","Remarks"
],

Offers:[
"Student ID","Application ID","University","Course","Offer Type",
"Offer Date","Offer Deadline","Deposit Amount",
"Deposit Deadline","Deposit Status","Offer Letter URL",
"Status","Notes"
],

Visa:[
"Student ID","Application ID","Country","University","Visa Type",
"Application Date","Biometrics Date","Medical Date",
"Interview Date","Decision Date","Visa Status",
"Refusal Reason","Visa Letter URL","Assigned Officer","Notes"
],

IELTS_Batches:[
"Batch Name","Teacher","Course Type","Start Date","End Date",
"Class Days","Class Time","Room","Capacity","Status","Notes"
],

IELTS_Students:[
"Student ID","Batch ID","Enrollment Date","Course Fee","Paid","Status","Notes"
],

IELTS_Attendance:[
"Batch ID","Student ID","Date","Status","Remarks"
],

IELTS_MockTests:[
"Student ID","Batch ID","Test Date","Listening","Reading",
"Writing","Speaking","Overall","Remarks"
],

IELTS_Results:[
"Student ID","Test Type","Test Date","Listening","Reading",
"Writing","Speaking","Overall","Certificate URL","Notes"
],

Payments:[
"Student ID","Invoice ID","Date","Purpose","Description",
"Amount","Payment Method","Transaction ID",
"Received By","Receipt Number","Notes"
],

Expenses:[
"Date","Category","Description","Amount",
"Payment Method","Reference","Paid By","Notes"
],

Invoices:[
"Student ID","Invoice Date","Due Date","Service","Description",
"Total Amount","Paid Amount"
],

MoneyReceipts:[
"Receipt Number","Student ID","Payment ID","Date","Purpose",
"Amount","Payment Method","Received By","Notes"
],

Income:[
"Date","Category","Description","Amount","Source",
"Payment Method","Received By","Reference","Notes"
],

Intake:[
"Country","University","Course","Intake Name",
"Application Deadline","Deposit Deadline",
"Visa Deadline","Status","Notes"
],

Counselling:[
"Student ID","Lead ID","Date","Counsellor","Country",
"Course","University","Budget","Student Requirement",
"Counsellor Recommendation","Next Action",
"Next Follow-up","Notes"
],

FollowUps:[
"Lead ID","Student ID","Assigned To","Follow-up Date",
"Follow-up Time","Type","Subject","Notes",
"Outcome","Next Follow-up","Status"
],

Tasks:[
"Title","Description","Assigned To","Related Student",
"Related Application","Priority","Due Date",
"Status","Completed At"
],

EmployeeAttendance:[
"Employee ID","Employee Name","Date",
"Check In","Check Out","Status","Remarks"
],

LeaveManagement:[
"Employee ID","Employee Name","Leave Type",
"Start Date","End Date","Total Days","Reason",
"Status","Approved By","Remarks"
],

Roles:[
"Role Name","Permissions","Status"
],

Settings:[
"Setting Name","Setting Value","Description","Status"
],

Notifications:[
"User ID","Title","Message","Type","Related ID","Is Read"
],

Timeline:[
"Student ID","Date","Event Type","Description","User ID"
],

LeadSources:[
"Source Name","Status","Notes"
],

StudentPortal:[
"Student ID","Username","Password","Status"
]

};


/* =========================================================
   STATE
========================================================= */

let user = null;
let currentModule = "";
let records = [];
let currentRow = null;
let dropdowns = null;
let cache = {};


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function loading(show){

  document
    .getElementById("loading")
    .classList.toggle(
      "show",
      show
    );

}


function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  setTimeout(
    function(){

      el.classList.remove(
        "show"
      );

    },
    2500
  );

}


/* =========================================================
   API
========================================================= */

async function api(
  action,
  data={}
){

  const payload = {

    action:action,

    ...data,

    user:user

  };


  const response =
    await fetch(
      API_URL,
      {
        method:"POST",
        body:
          JSON.stringify(
            payload
          )
      }
    );


  return response.json();

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const username =
    document
      .getElementById(
        "loginUsername"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  if(
    !username ||
    !password
  ){

    document
      .getElementById(
        "loginError"
      )
      .textContent =
      "Enter username and password.";

    return;

  }


  loading(true);


  try{

    const result =
      await api(
        "login",
        {
          username,
          password
        }
      );


    if(!result.success){

      document
        .getElementById(
          "loginError"
        )
        .textContent =
        result.message;

      return;

    }


    user =
      result.user;


    sessionStorage.setItem(
      "radiance_user",
      JSON.stringify(user)
    );


    start();


  }catch(error){

    document
      .getElementById(
        "loginError"
      )
      .textContent =
      "Unable to connect to CRM.";

  }finally{

    loading(false);

  }

}


/* =========================================================
   START
========================================================= */

function start(){

  document
    .getElementById(
      "loginScreen"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "app"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "userInfo"
    )
    .textContent =
    user.name +
    " • " +
    user.role;


  buildNav();


  openModule(
    "Dashboard"
  );

}


/* =========================================================
   NAV
========================================================= */

function buildNav(){

  const nav =
    document
      .getElementById(
        "navigation"
      );


  nav.innerHTML = "";


  Object.keys(
    MODULES
  )
  .forEach(function(group){

    const title =
      document.createElement(
        "div"
      );


    title.className =
      "nav-group";


    title.textContent =
      group;


    nav.appendChild(
      title
    );


    MODULES[group]
      .forEach(function(module){

        const btn =
          document.createElement(
            "button"
          );


        btn.className =
          "nav-btn";


        btn.dataset.module =
          module;


        btn.textContent =
          LABELS[module] ||
          module;


        btn.onclick =
          function(){

            openModule(
              module
            );

          };


        nav.appendChild(
          btn
        );

      });

  });

}


function activeNav(){

  document
    .querySelectorAll(
      ".nav-btn"
    )
    .forEach(function(btn){

      btn.classList.toggle(
        "active",
        btn.dataset.module ===
        currentModule
      );

    });

}


/* =========================================================
   OPEN MODULE
========================================================= */

async function openModule(
  module
){

  currentModule =
    module;


  activeNav();


  document
    .getElementById(
      "pageTitle"
    )
    .textContent =
    LABELS[module] ||
    module;


  if(
    module ===
    "Dashboard"
  ){

    await dashboard();

    return;

  }


  if(
    module ===
    "Reports"
  ){

    await reports();

    return;

  }


  await loadDropdowns();


  if(
    module ===
    "DuePayments"
  ){

    const data =
      await loadRecords(
        "Invoices"
      );


    records =
      data.filter(
        function(x){

          return (
            Number(
              x["Due Amount"]
            ) || 0
          ) > 0;

        }
      );


    renderTable(

  }


  await loadRecords(

}

/* =========================================================
   LOAD RECORDS
========================================================= */

async function loadRecords(
  module
){

  if(cache[module]){

    records =
      cache[module];


    renderTable(
      LABELS[module] ||
      module
    );


    return records;

  }


  loading(true);


  try{

    const result =
      await api(
        "list",
        {
          module:module
        }
      );


    if(!result.success){

      toast(
        result.message
      );

      return [];

    }


    records =
      result.records ||
      [];


    cache[module] =
      records;


    renderTable(
      LABELS[module] ||
      module
    );


    return records;


  }catch(error){

    toast(
      error.message
    );


    return [];


  }finally{

    loading(false);

  }

}


/* =========================================================
   TABLE
========================================================= */

function renderTable(
  title
){

  const content =
    document.getElementById(
      "content"
    );


  const toolbar = `

    <div class="toolbar">

      <input
        id="search"
        class="search"
        placeholder="Search..."
        oninput="filterTable()"
      >

      <button
        class="btn"
        onclick="openModal()"
      >
        + Add New
      </button>

    </div>

  `;


  if(!records.length){

    content.innerHTML =
      toolbar +
      `

      <div class="card">

        <h3>
          ${esc(title)}
        </h3>

        <div class="empty">
          No records found.
        </div>

      </div>

      `;


    return;

  }


  let keys =
    Object.keys(
      records[0]
    )
    .filter(function(key){

      return key !== "_row";

    });


  keys =
    prioritize(
      keys
    )
    .slice(
      0,
      10
    );


  content.innerHTML =
    toolbar +
    `

    <div class="table-card">

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              ${keys
                .map(function(key){

                  return `
                    <th>
                      ${esc(key)}
                    </th>
                  `;

                })
                .join("")
              }

              <th>
                Actions
              </th>

            </tr>

          </thead>

          <tbody id="tableBody">

            ${rowsHtml(
              records,
              keys
            )}

          </tbody>

        </table>

      </div>

    </div>

    `;

}


function prioritize(
  keys
){

  const first = [

    "Student ID",
    "Lead ID",
    "Application ID",
    "Invoice ID",

    "Name",
    "Employee Name",

    "Phone",
    "WhatsApp",

    "Country",
    "University",
    "Course",

    "Status",
    "Date"

  ];


  const output = [];


  first.forEach(function(name){

    if(
      keys.includes(name) &&
      !output.includes(name)
    ){

      output.push(name);

    }

  });


  keys.forEach(function(name){

    if(
      !output.includes(name)
    ){

      output.push(name);

    }

  });


  return output;

}


function rowsHtml(
  data,
  keys
){

  return data
    .map(function(row){

      return `

      <tr>

        ${keys
          .map(function(key){

            return `
              <td>
                ${cell(
                  row[key],
                  key
                )}
              </td>
            `;

          })
          .join("")
        }

        <td>

          <div class="actions">

            <button
              class="btn btn-light"
              onclick="openModal(${row._row})"
            >
              Edit
            </button>

            <button
              class="btn btn-danger"
              onclick="deleteRecord(${row._row})"
            >
              Delete
            </button>

          </div>

        </td>

      </tr>

      `;

    })
    .join("");

}


function cell(
  value,
  key
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "";

  }


  const text =
    String(value);


  if(
    key === "Phone" ||
    key === "WhatsApp"
  ){

    return `

      ${esc(text)}

      <button
        class="whatsapp"
        onclick="whatsapp('${esc(text)}')"
      >
        WhatsApp
      </button>

    `;

  }


  if(
    key.toLowerCase()
      .includes("url")
  ){

    return `

      <a
        href="${esc(text)}"
        target="_blank"
      >
        Open
      </a>

    `;

  }


  if(
    key === "Status" ||
    key.endsWith(" Status")
  ){

    return `
      <span class="badge">
        ${esc(text)}
      </span>
    `;

  }


  if(text.length > 70){

    return esc(
      text.substring(0,67)
    ) + "...";

  }


  return esc(text);

}


/* =========================================================

========================================================= */

function filterTable(){

  const query =
    (
      document
        .getElementById(
          "search"
        )
        .value ||
      ""
    )
    .toLowerCase();


  const filtered =
    records.filter(function(row){

      return JSON.stringify(
        row
      )
      .toLowerCase()
      .includes(
        query
      );

    });


  const keys =
    prioritize(
      Object.keys(
        records[0] || {}
      )
      .filter(function(k){

        return k !== "_row";

      })
    )
    .slice(0,10);


  document
    .getElementById(
      "tableBody"
    )
    .innerHTML =
    rowsHtml(
      filtered,
      keys
    );

}

                    ) ===

/* =========================================================
   OPEN MODAL
========================================================= */

function openModal(
  row
){

  currentRow =
    row || null;


  const existing =
    row
      ? records.find(
          function(x){

            return (
              Number(x._row) ===
              Number(row)
            );

          }
        ) || {}
      : {};


  let fields =
    HEADERS[currentModule];


  if(!fields){

    fields =
      records.length
        ? Object.keys(
            records[0]
          )
          .filter(function(k){

            return (
              k !== "_row" &&
              !isAuto(k)
            );

          })
        : [];

  }


  /*
   * Employee Attendance:
   * Employee Name is automatically populated,
   * but we keep it visible/read-only.
   */
  let html =
    fields
      .map(function(field){

        return formField(
          field,
          existing[field]
        );

      })
      .join("");


  if(
    currentModule ===
    "Documents"
  ){

    html += `

      <div class="field">

        <label>
          Upload File
        </label>

        <input
          id="documentFile"
          type="file"
        >

      </div>

    `;

  }


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
    (
      row
        ? "Edit "
        : "Add "
    ) +
    (
      LABELS[
        currentModule
      ] ||
      currentModule
    );


  document
    .getElementById(
      "form"
    )
    .innerHTML =
    html;


  /*
   * Employee name readonly.
   */
  if(
    currentModule ===
    "EmployeeAttendance" ||
    currentModule ===
    "LeaveManagement"
  ){

    const employeeName =
      document.getElementById(
        fid("Employee Name")
      );


    if(employeeName){

      employeeName.readOnly =
        true;

    }

    const employeeId =
      document.getElementById(
        fid("Employee ID")
      );


    if(employeeId){

      employeeId.addEventListener(
        "change",
        autoEmployeeName
      );

    }

  }


  /*
   * Leave date calculation.
   */
  if(
    currentModule ===
    "LeaveManagement"
  ){

    const start =
      document.getElementById(
        fid("Start Date")
      );

    const end =
      document.getElementById(
        fid("End Date")
      );


    if(start)
      start.addEventListener(
        "change",
        calculateLeaveDays
      );


    if(end)
      end.addEventListener(
        "change",
        calculateLeaveDays
      );

  }


  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "show"
    );

}


/* =========================================================
   EMPLOYEE NAME
========================================================= */

function autoEmployeeName(){

  const id =
    document.getElementById(
      fid("Employee ID")
    );


  const name =
    document.getElementById(
      fid("Employee Name")
    );


  if(
    !id ||
    !name ||
    !dropdowns
  )
    return;


  const employee =
    dropdowns.users.find(
      function(x){

        return (
          String(
            x["User ID"]
          ) ===
          String(
            id.value
          )
        );

      }
    );


  if(employee){

    name.value =
      employee.Name;

  }else{

    name.value =
      "";

  }

}


/* =========================================================
   LEAVE DAYS
========================================================= */

function calculateLeaveDays(){

  const start =
    document.getElementById(
      fid("Start Date")
    );


  const end =
    document.getElementById(
      fid("End Date")
    );


  const total =
    document.getElementById(
      fid("Total Days")
    );


  if(
    !start ||
    !end ||
    !total ||
    !start.value ||
    !end.value
  ){

    if(total)
      total.value = "";

    return;

  }


  const s =
    new Date(
      start.value
    );

  const e =
    new Date(
      end.value
    );


  if(
    e < s
  ){

    total.value =
      "";

    return;

  }


  total.value =
    Math.floor(
      (
        e - s
      ) /
      86400000
    ) + 1;

}


/* =========================================================
   SAVE
========================================================= */

async function saveRecord(){

  const fields =
    HEADERS[currentModule] ||
    [];


  const record = {};


  fields.forEach(function(field){

    const element =
      document.getElementById(
        fid(field)
      );


    if(element){

      record[field] =
        element.value;

    }

  });


  if(currentRow){

    record._row =
      currentRow;

  }


  /*
   * Password is only sent when filled.
   */
  if(
    currentModule ===
    "Users"
  ){

    const password =
      document.getElementById(
        fid("Password")
      );


    if(
      password &&
      password.value
    ){

      record.Password =
        password.value;

    }

  }


  /*
   * Document upload.
   */
  if(
    currentModule ===
    "Documents"
  ){

    const file =
      document.getElementById(
        "documentFile"
      );


    if(
      file &&
      file.files.length
    ){

      await uploadFile(
        record,
        file.files[0]
      );

      return;

    }

  }


  loading(true);


  try{

    const result =
      await api(
        "save",
        {
          module:
            currentModule,
          record:
            record
        }
      );


    if(!result.success){

      toast(
        result.message
      );

      return;

    }


    closeModal();


    delete cache[
      currentModule
    ];


    dropdowns =
      null;


    await openModule(
      currentModule
    );


    toast(
      "Saved successfully."
    );


  }catch(error){

    toast(
      error.message
    );

  }finally{

    loading(false);

  }

}

   DOCUMENT UPLOAD

async function uploadFile(
  record,
  file
){

  loading(true);


  try{

    const base64 =
      await toBase64(

      );


    const result =
      await api(
        "uploadDocument",
        {

          base64:
            base64,

          fileName:
            file.name,

          mimeType:
            file.type,

          studentId:
            record["Student ID"] ||
            "",

          applicationId:
            record["Application ID"] ||
            "",

          documentType:
            record["Document Type"] ||
            "Other",

          expiryDate:
            record["Expiry Date"] ||
            "",

          notes:
            record.Notes ||
            ""

        }
      );


    if(!result.success){

      toast(
        result.message
      );

      return;

    }


    closeModal();

    delete cache.Documents;

    await openModule(
      "Documents"
    );

    toast(
      "Document uploaded successfully."
    );


  }catch(error){

    toast(
      error.message
    );

  }finally{

    loading(false);

  }

}


function toBase64(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          resolve(
            String(
              reader.result
            )
            .split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

function reportTable(
  data
){

  const entries =
    Object.entries(
      data || {}
    );


  if(!entries.length){

    return `
      <p>
        No data available.
      </p>
    `;

  }


  return `

    <table
      style="min-width:100%"
    >

      <tbody>

        ${entries
          .map(function(x){

            return `

              <tr>

                <td>
                  ${esc(x[0])}
                </td>

                <td>
                  ${x[1]}
                </td>

              </tr>

            `;

          })
          .join("")
        }

      </tbody>

    </table>

  `;

}


/* =========================================================
   WHATSAPP
========================================================= */

function whatsapp(
  phone
){

  let number =
    String(
      phone || ""
    )
    .replace(
      /\D/g,
      ""
    );


  if(
    number.startsWith("0")
  ){

    number =
      "880" +
      number.substring(1);

  }else if(
    !number.startsWith("880")
  ){

    number =
      "880" +
      number;

  }


  if(
    number.length < 11
  ){

    toast(
      "Invalid phone number."
    );

    return;

  }


  window.open(
    "https://wa.me/" +
    number,
    "_blank"
  );

}

  if(
    currentModule ===

  ){

    await reports();

  if(
    currentModule ===
    "DuePayments"
  ){

    delete cache.Invoices;

  }else{

      currentModule
    ];

  }


  dropdowns =
    null;


  await openModule(
    currentModule
  );

}

/* =========================================================
   RESTORE SESSION
========================================================= */

(function(){

  try{

    const saved =
      sessionStorage.getItem(
        "radiance_user"
      );


    if(saved){

      const parsed =
        JSON.parse(
          saved
        );


      if(
        parsed &&
        parsed.token
      ){

        user =
          parsed;


        start();

      }

    }

  }catch(error){

    sessionStorage.removeItem(
      "radiance_user"
    );

  }

})();
