<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

  name="viewport"

<title>Radiance Bangladesh CRM</title>

<style>

:root{
  --primary:#6d28d9;
  --secondary:#4f46e5;
  --dark:#111827;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#667085;
  --border:#e5e7eb;
  --success:#16a34a;
  --danger:#dc2626;
  --warning:#d97706;
  --info:#2563eb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

/* =========================================================
   LOGIN
========================================================= */

.login-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(
    135deg,
    #eef2ff,
    #faf5ff
  );
}

.login-box{
  width:min(420px,92%);
  background:#fff;
  padding:32px;
  border-radius:18px;
  box-shadow:0 20px 60px #0002;
}

.login-logo{
  display:block;
  width:100px;
  height:100px;
  object-fit:contain;
  margin:auto auto 15px;
}

.login-box h2{
  text-align:center;
  margin:0;
}

.login-box p{
  text-align:center;
  color:var(--muted);
}

/* =========================================================
   FORM
========================================================= */

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  background:#fff;
  color:var(--text);
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px #6d28d922;
}

.field textarea{
  min-height:85px;
  resize:vertical;
}

.field small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.form-full{
  grid-column:1/-1;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  background:var(--primary);
  color:#fff;
}

.btn:hover{
  opacity:.92;
}

.btn-light{
  background:#fff;
  color:var(--text);
  border:1px solid var(--border);
}

.btn-danger{
  background:var(--danger);
}

.btn-success{
  background:var(--success);
}

.btn-warning{
  background:var(--warning);
}

.btn-info{
  background:var(--info);
}

.btn-small{
  padding:6px 9px;
  font-size:12px;
}

/* =========================================================
   APP
========================================================= */

.app{
  min-height:100vh;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:#111827;
  color:#fff;
  overflow-y:auto;
  z-index:100;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  padding:16px;
  border-bottom:1px solid #273043;
}

.brand img{
  width:45px;
  height:45px;
  object-fit:contain;
  background:#fff;
  border-radius:8px;
  padding:4px;
}

.brand-title{
  font-size:15px;
  font-weight:bold;
}

.brand-sub{
  color:#9ca3af;
  font-size:11px;
}

.nav-group{
  color:#8b95a7;
  font-size:10px;
  padding:14px 12px 5px;
  text-transform:uppercase;
}

.nav-btn{
  display:block;
  width:calc(100% - 16px);
  margin:2px 8px;
  border:0;
  background:transparent;
  color:#cbd5e1;
  padding:10px 12px;
  text-align:left;
  border-radius:8px;
}

.nav-btn:hover,
.nav-btn.active{
  background:#293244;
  color:#fff;
}

/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:250px;
  padding:18px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:10px;
}

.topbar h1{
  font-size:23px;
  margin:0;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.user-info{
  font-size:13px;
  color:var(--muted);
}

.menu-btn{
  display:none;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.stat small{
  color:var(--muted);
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:7px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.report-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.toolbar-left,
.toolbar-right{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.search{
  width:300px;
  max-width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
}

/* =========================================================
   TABLE
========================================================= */

.table-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.table-wrap{
  overflow:auto;
  max-height:70vh;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:900px;
}

th,
td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
  white-space:nowrap;
}

th{
  position:sticky;
  top:0;
  background:#f8fafc;
  z-index:2;
}

tbody tr:hover{
  background:#fafafa;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:30px;
  background:#eef2ff;
  font-size:11px;
}

.actions{
  display:flex;
  gap:5px;
}

.whatsapp{
  background:#16a34a;
  color:#fff;
  border:0;
  border-radius:5px;
  padding:4px 7px;
  font-size:11px;
  margin-left:5px;
}

.empty{
  padding:45px;
  text-align:center;
  color:var(--muted);
}

/* =========================================================
   PAGINATION
========================================================= */

.pagination{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  gap:10px;
  border-top:1px solid var(--border);
}

.page-buttons{
  display:flex;
  gap:5px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:200;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(1000px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
}

/* =========================================================
   PHOTO
========================================================= */

.photo-preview{
  width:100px;
  height:100px;
  border-radius:12px;
  object-fit:cover;
  border:1px solid var(--border);
  background:#f8fafc;
  display:block;
  margin-top:8px;
}

/* =========================================================
   ATTENDANCE SUMMARY
========================================================= */

.summary-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:15px;
}

.summary-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
}

.summary-card small{
  color:var(--muted);
}

.summary-card strong{
  display:block;
  font-size:22px;
  margin-top:5px;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:#fff9;
  z-index:500;
}

.loading.show{
  display:grid;
}

.loading-box{
  background:#fff;
  padding:18px 25px;
  border-radius:10px;
  box-shadow:0 10px 40px #0002;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  padding:12px 17px;
  background:#111827;
  color:#fff;
  border-radius:8px;
  display:none;
  z-index:600;
}

.toast.show{
  display:block;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

  .dashboard{
    grid-template-columns:repeat(2,1fr);
  }

  .summary-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:700px){

  .sidebar{
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:12px;
  }

  .menu-btn{
    display:inline-block;
  }

  .user-info{
    display:none;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .dashboard{
    grid-template-columns:1fr 1fr;
  }

  .report-grid{
    grid-template-columns:1fr;
  }

  .summary-grid{
    grid-template-columns:1fr 1fr;
  }

}

<body>

<!-- ======================================================
     LOGIN
====================================================== -->

<div
  id="loginScreen"
  class="login-screen"
>

  <div class="login-box">

    <img
      id="loginLogo"
      src="./logo.png"
      class="login-logo"
      alt="Radiance Bangladesh"
      onerror="this.onerror=null;this.src='./assets/logo.png'"
    >

    <h2>
      Radiance Bangladesh
    </h2>

    <p>
      CRM & Business Management System
    </p>

    <div class="field">

      <label>
        Username
      </label>

      <input
        id="loginUsername"
        autocomplete="username"
      >

    </div>

    <div class="field">

      <label>
        Password
      </label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()"
      >

    </div>

    <button
      class="btn"
      style="width:100%"
      onclick="login()"
    >
      Login
    </button>

    <div
      id="loginError"
      style="color:#dc2626;text-align:center;margin-top:10px"
    ></div>

  </div>

</div>


<!-- ======================================================
     APPLICATION
====================================================== -->

<div
  id="app"
  style="display:none"
>

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="brand">

      <img
        src="./logo.png"
        alt="Radiance"
        onerror="this.onerror=null;this.src='./assets/logo.png'"
      >

      <div>

        <div class="brand-title">
          Radiance Bangladesh
        </div>

        <div class="brand-sub">
          CRM / BMS
        </div>

      </div>

    </div>

    <div id="navigation"></div>

  </aside>


  <main class="main">

    <div class="topbar">

      <div
        style="display:flex;align-items:center;gap:10px"
      >

        <button
          class="btn btn-light menu-btn"
          onclick="toggleSidebar()"
        >
          ☰
        </button>

        <h1 id="pageTitle">
          Dashboard
        </h1>

      </div>

      <div class="top-actions">

        <span
          id="userInfo"
          class="user-info"
        ></span>

        <button
          class="btn btn-light"
          onclick="refresh()"
        >
          Refresh
        </button>

        <button
          class="btn btn-danger"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

    </div>

    <div id="content"></div>

  </main>

</div>


<!-- ======================================================
     MODAL
====================================================== -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Record
      </h2>

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        Close
      </button>

    </div>

    <div
      id="form"
      class="form-grid"
    ></div>

    <div
      style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"
    >

      <button
        class="btn btn-light"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="btn"
        onclick="saveRecord()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- LOADING -->

<div
  id="loading"
  class="loading"
>

  <div class="loading-box">
    Please wait…
  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast"
></div>

/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function loading(show){

  document
    .getElementById("loading")
    .classList.toggle(
      "show",
      show
    );

}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent =
    message || "";

  el.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      function(){

        el.classList.remove("show");

      },
      2800
    );

}


/* =========================================================
   API
========================================================= */

async function api(
  action,
  data={}
){

  const payload = {
    action,
    ...data
  };

  if(
    user &&
    user.token
  ){

    payload.token =
      user.token;

  }

  const response =
    await fetch(
      API_URL,
      {
        method:"POST",
        body:
          JSON.stringify(
            payload
          )
      }
    );

  const text =
    await response.text();

  let result;

  try{

    result =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "Invalid response from CRM server."
    );

  }

  if(
    result &&
    result.authenticated === false
  ){

    sessionStorage.clear();

    location.reload();

  }

  return result;

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const username =
    document
      .getElementById("loginUsername")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const errorEl =
    document
      .getElementById("loginError");

  errorEl.textContent = "";

  if(
    !username ||
    !password
  ){

    errorEl.textContent =
      "Enter username and password.";

    return;

  }

  loading(true);

  try{

    const result =
      await api(
        "login",
        {
          username,
          password
        }
      );

    if(!result.success){

      errorEl.textContent =
        result.message ||
        "Login failed.";

      return;

    }

    user =
      result.user;

    sessionStorage.setItem(
      "radiance_token",
      user.token
    );

    sessionStorage.setItem(
      "radiance_user",
      JSON.stringify(user)
    );

    start();

  }catch(error){

    errorEl.textContent =
      error.message ||
      "Unable to connect to CRM.";

  }finally{

    loading(false);

  }

}


/* =========================================================
   START
========================================================= */

function start(){

  document
    .getElementById("loginScreen")
    .style.display =
    "none";

  document
    .getElementById("app")
    .style.display =
    "block";

  document
    .getElementById("userInfo")
    .textContent =
    (
      user.name ||
      user["Full Name"] ||
      ""
    ) +
    " • " +
    (
      user.role ||
      user.Role ||
      ""
    );

  buildNav();

  openModule("Dashboard");

}


/* =========================================================
   NAVIGATION
========================================================= */

function buildNav(){

  const nav =
    document.getElementById(
      "navigation"
    );

  nav.innerHTML = "";

  Object.keys(
    MODULES
  )
  .forEach(function(group){

    const title =
      document.createElement(
        "div"
      );

    title.className =
      "nav-group";

    title.textContent =
      group;

    nav.appendChild(
      title
    );

    MODULES[group]
      .forEach(function(module){

        const btn =
          document.createElement(
            "button"
          );

        btn.className =
          "nav-btn";

        btn.dataset.module =
          module;

        btn.textContent =
          LABELS[module] ||
          module;

        btn.onclick =
          function(){

            openModule(
              module
            );

            if(
              window.innerWidth <= 700
            ){

              document
                .getElementById("sidebar")
                .classList.remove(
                  "open"
                );

            }

          };

        nav.appendChild(
          btn
        );

      });

  });

}


function activeNav(){

  document
    .querySelectorAll(".nav-btn")
    .forEach(function(btn){

      btn.classList.toggle(
        "active",
        btn.dataset.module ===
        currentModule
      );

    });

}


/* =========================================================
   OPEN MODULE
========================================================= */

async function openModule(
  module
){

  currentModule =
    module;

  currentPage = 1;

  activeNav();

  document
    .getElementById("pageTitle")
    .textContent =
    LABELS[module] ||
    module;

  if(
    module === "Dashboard"
  ){

    await dashboard();
    return;

  }

  if(
    module === "Reports"
  ){

    await reports();
    return;

  }

  if(
    module === "DuePayments"
  ){

    await duePayments();
    return;

  }

  if(
    module === "EmployeeAttendance"
  ){

    await renderAttendanceModule();
    return;

  }

  await loadRecords(
    module
  );

}

){

/* =========================================================
   LOAD RECORDS
========================================================= */

async function loadRecords(
  module,
  options={}
){

  const page =
    options.page ||
    currentPage;

  const size =
    options.pageSize ||
    pageSize;

  const search =
    options.search ||
    "";

  const cacheKey =
    module +
    "|" +
    page +
    "|" +
    size +
    "|" +
    search;

  if(
    moduleCache[
      cacheKey
    ]
  ){

    const cached =
      moduleCache[
        cacheKey
      ];

    records =
      cached.records;

    totalRecords =
      cached.total;

    renderTable(
      LABELS[module] ||
      module
    );

    return cached;

  }

  loading(true);

  try{

    const result =
      await api(
        "list",
        {
          module,
          page,
          pageSize:size,
          search
        }
      );

    if(!result.success){

      toast(
        result.message ||
        "Unable to load records."
      );

      return {
        records:[],
        total:0
      };

    }

    records =
      result.records ||
      [];

    totalRecords =
      Number(
        result.total ||
        records.length
      );

    moduleCache[
      cacheKey
    ] = {
      records,
      total:
        totalRecords
    };

    renderTable(
      LABELS[module] ||
      module
    );

    return {
      records,
      total:
        totalRecords
    };

  }catch(error){

    toast(
      error.message
    );

    return {
      records:[],
      total:0
    };

  }finally{

    loading(false);

  }

}


/* =========================================================
   TABLE
========================================================= */

function renderTable(
  title
){

  const content =
    document.getElementById(
      "content"
    );

  const toolbar = `

    <div class="toolbar">

      <div class="toolbar-left">

        <input
          id="search"
          class="search"
          placeholder="Search ${esc(title)}..."
          value=""
          onkeydown="
            if(event.key==='Enter'){
              searchCurrentModule();
            }
          "
        >

        <button
          class="btn btn-light"
          onclick="searchCurrentModule()"
        >
          Search
        </button>

      </div>

      <div class="toolbar-right">

        <button
          class="btn"
          onclick="openModal()"
        >
          + Add New
        </button>

      </div>

    </div>

  `;

  if(!records.length){

    content.innerHTML =
      toolbar +
      `

      <div class="card">

        <h3>
          ${esc(title)}
        </h3>

        <div class="empty">
          No records found.
        </div>

      </div>

      `;

    return;

  }

  let keys =
    Object.keys(
      records[0]
    )
    .filter(function(key){

      return (
        key !== "_row"
      );

    });

  keys =
    prioritize(keys);

  content.innerHTML =
    toolbar +
    `

    <div class="table-card">

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              ${keys
                .map(function(key){

                  return `
                    <th>
                      ${esc(key)}
                    </th>
                  `;

                })
                .join("")
              }

              <th>
                Actions
              </th>

            </tr>

          </thead>

          <tbody id="tableBody">

            ${rowsHtml(
              records,
              keys
            )}

          </tbody>

        </table>

      </div>

      ${paginationHtml()}

    </div>

    `;

}


function prioritize(
  keys
){

  const first = [

    "Employee ID",
    "Employee Name",

    "Student ID",
    "Lead ID",
    "Application ID",
    "Invoice ID",

    "Name",
    "Full Name",

    "Phone",
    "WhatsApp",

    "Country",
    "University",
    "Course",

    "Date",
    "Status"

  ];

  const output = [];

  first.forEach(function(name){

    if(
      keys.includes(name) &&
      !output.includes(name)
    ){

      output.push(name);

    }

  });

  keys.forEach(function(name){

    if(
      !output.includes(name)
    ){

      output.push(name);

    }

  });

  return output;

}


function rowsHtml(
  data,
  keys
){

  return data
    .map(function(row){

      return `

      <tr>

        ${keys
          .map(function(key){

            return `

              <td>

                ${cell(
                  row[key],
                  key
                )}

              </td>

            `;

          })
          .join("")
        }

        <td>

          <div class="actions">

            ${
              currentModule ===
              "Notifications"
              &&
              String(
                row["Is Read"] ||
                ""
              ).toLowerCase() !==
              "yes"
              ?
              `
              <button
                class="btn btn-success btn-small"
                onclick="markNotificationRead(${row._row})"
              >
                Mark Read
              </button>
              `
              :
              ""
            }

            <button
              class="btn btn-light btn-small"
              onclick="openModal(${row._row})"
            >
              Edit
            </button>

            ${
              currentModule ===
              "ActivityLog"
              ?
              ""
              :
              `
              <button
                class="btn btn-danger btn-small"
                onclick="deleteRecord(${row._row})"
              >
                Delete
              </button>
              `
            }

          </div>

        </td>

      </tr>

      `;

    })
    .join("");

}


function cell(
  value,
  key
){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "";

  }

  const text =
    String(value);

  if(
    key === "Phone" ||
    key === "WhatsApp"
  ){

    return `

      ${esc(text)}

      <button
        class="whatsapp"
        onclick="whatsapp('${esc(text)}')"
      >
        WhatsApp
      </button>

    `;

  }

  if(
    key.toLowerCase()
      .includes("url")
  ){

    return `

      <a
        href="${esc(text)}"
        target="_blank"
        rel="noopener"
      >
        Open
      </a>

    `;

  }

  if(
    key === "Photo"
  ){

    return `

      <img
        src="${esc(normalizeDriveImage(text))}"
        style="
          width:42px;
          height:42px;
          border-radius:50%;
          object-fit:cover;
        "
        onerror="this.style.display='none'"
      >

    `;

  }

  if(
    key === "Status" ||
    key.endsWith(" Status") ||
    key === "Application Status" ||
    key === "Visa Status"
  ){

    return `
      <span class="badge">
        ${esc(text)}
      </span>
    `;

  }

  if(
    text.length > 120
  ){

    return (
      esc(
        text.substring(
          0,
          117
        )
      ) +
      "..."
    );

  }

  return esc(text);

}


/* =========================================================
   PAGINATION
========================================================= */

function paginationHtml(){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        totalRecords /
        pageSize
      )
    );

  return `

    <div class="pagination">

      <div>
        Page
        <strong>
          ${currentPage}
        </strong>
        of
        <strong>
          ${totalPages}
        </strong>

        •
        ${totalRecords}
        records
      </div>

      <div class="page-buttons">

        <button
          class="btn btn-light btn-small"
          onclick="changePage(-1)"
          ${currentPage <= 1 ? "disabled" : ""}
        >
          Previous
        </button>

        <button
          class="btn btn-light btn-small"
          onclick="changePage(1)"
          ${currentPage >= totalPages ? "disabled" : ""}
        >
          Next
        </button>

      </div>

    </div>

  `;

}


async function changePage(
  direction
){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        totalRecords /
        pageSize
      )
    );

  const next =
    currentPage +
    direction;

  if(
    next < 1 ||
    next > totalPages
  ){

    return;

  }

  currentPage =
    next;

  await loadRecords(
    currentModule,
    {
      page:
        currentPage,
      pageSize
    }
  );

}


async function searchCurrentModule(){

  currentPage = 1;

  const searchEl =
    document.getElementById(
      "search"
    );

  const search =
    searchEl
      ? searchEl.value.trim()
      : "";

  await loadRecords(
    currentModule,
    {
      page:1,
      pageSize,
      search
    }
  );

}

      "bKash",
      "Nagad",
      "Rocket",
      "Bank Transfer",
      "Card"
    ]
    .map(function(x){

      return {
        value:x,
        label:x
      };

    });

  }


  /* YES / NO */

  if(
    field === "Required" ||
    field === "Received" ||
    field === "Verified" ||
    field === "Is Read"
  ){

    return [
      "Yes",
      "No"
    ]
    .map(function(x){

      return {
        value:x,
        label:x
      };

    });

  }


  /* COMMON STATUS */

  if(
    field === "Status" ||
    field.endsWith(" Status")
  ){

    return [
      "Active",
      "Inactive",
      "Pending",
      "Approved",
      "Rejected",
      "Cancelled",
      "Completed",
      "In Progress",
      "Submitted",
      "Under Review",
      "Paid",
      "Partially Paid",
      "Due",
      "Draft",
      "Withdrawn"
    ]
    .map(function(x){

      return {
        value:x,
        label:x
      };

    });

  }

  return null;

}


/* =========================================================
   FORM FIELD
========================================================= */

function formField(
  field,
  value
){

  const id =
    fid(field);

  const options =
    optionsFor(field);


  /* AUTO ID */

  if(
    isAutoField(
      currentModule,
      field
    )
  ){

    if(
      !currentRow
    ){

      return "";

    }

    return `

      <div class="field">

        <label>
          ${esc(field)}
        </label>

        <input
          id="${id}"
          value="${esc(value || "")}"
          readonly
          style="background:#f8fafc"
        >

      </div>

    `;

  }


  /* MARKED BY */

  if(
    field === "Marked By"
  ){

    const marked =
      (
        user.employeeId ||
        user["Employee ID"] ||
        user.name ||
        user["Full Name"] ||
        ""
      );

    return `

      <div class="field">

        <label>
          Marked By
        </label>

        <input
          id="${id}"
          value="${esc(
            value ||
            marked
          )}"
          readonly
          style="background:#f8fafc"
        >

      </div>

    `;

  }


  /* SELECT */

  if(options){

    let optionList =
      options;

    /*
     * Preserve an old value that is not
     * currently present in the dropdown.
     */

    if(
      value &&
      !optionList.some(function(o){

        return String(o.value) ===
          String(value);

      })
    ){

      optionList = [
        {
          value:String(value),
          label:
            String(value) +
            " (existing value)"
        },
        ...optionList
      ];

    }

    return `

      <div class="field">

        <label>
          ${esc(field)}
        </label>

        <select
          id="${id}"
          onchange="fieldChanged('${esc(field)}')"
        >

          <option value="">
            Select...
          </option>

          ${optionList
            .map(function(o){

              return `

                <option
                  value="${esc(o.value)}"
                  ${
                    String(
                      value || ""
                    ) ===
                    String(
                      o.value
                    )
                      ? "selected"
                      : ""
                  }
                >
                  ${esc(o.label)}
                </option>

              `;

            })
            .join("")
          }

        </select>

      </div>

    `;

  }


  /* PASSWORD */

  if(
    field === "Password"
  ){

    return `

      <div class="field">

        <label>
          Password
        </label>

        <input
          id="${id}"
          type="password"
          placeholder="${
            currentRow
              ? "Leave blank to keep existing password"
              : ""
          }"
        >

      </div>

    `;

  }


  /* PHONE */

  if(
    field === "Phone" ||
    field === "WhatsApp"
  ){

    return `

      <div class="field">

        <label>
          ${esc(field)}
        </label>

        <input
          id="${id}"
          type="tel"
          inputmode="tel"
          value="${esc(value || "")}"
          placeholder="017XXXXXXXX"
        >

        <small>
          Phone is stored as text so leading 0 is preserved.
        </small>

      </div>

    `;

  }


  /* DATE */

  if(
    field.toLowerCase()
      .includes("date")
  ){

    return `

      <div class="field">

        <label>
          ${esc(field)}
        </label>

        <input
          id="${id}"
          type="date"
          value="${esc(
            normalizeDateValue(
              value
            )
          )}"
        >

      </div>

    `;

  }


  /* TIME */

  if(
    field.toLowerCase()
      .includes("time")
  ){

    return `

      <div class="field">

        <label>
          ${esc(field)}
        </label>

        <input
          id="${id}"
          type="time"
          value="${esc(
            String(
              value ||
              ""
            ).substring(
              0,
              5
            )
          )}"
        >

      </div>

    `;

  }


  /* TOTAL DAYS */

  if(
    field === "Total Days"
  ){

    return `

      <div class="field">

        <label>
          Total Days
        </label>

        <input
          id="${id}"
          type="number"
          value="${esc(value || "")}"
          readonly
          style="background:#f8fafc"
        >

      </div>

    `;

  }


  /* NUMERIC */

  if(
    field.toLowerCase()
      .includes("amount") ||
    field.toLowerCase()
      .includes("fee") ||
    field.toLowerCase()
      .includes("budget") ||
    field.toLowerCase()
      .includes("score") ||
    field.toLowerCase()
      .includes("gpa") ||
    field.toLowerCase()
      .includes("ranking") ||
    field.toLowerCase()
      .includes("capacity") ||
    field === "Sort Order"
  ){

    return `

      <div class="field">

        <label>
          ${esc(field)}
        </label>

        <input
          id="${id}"
          type="number"
          step="any"
          value="${esc(value || "")}"
        >

      </div>

    `;

  }


  /* TEXTAREA */

  if(
    field.toLowerCase()
      .includes("description") ||
    field.toLowerCase()
      .includes("notes") ||
    field.toLowerCase()
      .includes("remarks") ||
    field.toLowerCase()
      .includes("reason") ||
    field.toLowerCase()
      .includes("address") ||
    field.toLowerCase()
      .includes("requirement") ||
    field.toLowerCase()
      .includes("recommendation") ||
    field.toLowerCase()
      .includes("message") ||
    field.toLowerCase()
      .includes("reference")
  ){

    return `

      <div class="field">

        <label>
          ${esc(field)}
        </label>

        <textarea
          id="${id}"
        >${esc(value || "")}</textarea>

      </div>

    `;

  }


  return `

    <div class="field">

      <label>
        ${esc(field)}
      </label>

      <input
        id="${id}"
        value="${esc(value || "")}"
      >

    </div>

  `;

}

  module,
  field
){

    AUTO_ID_FIELDS[module] ===
    field
  );

}


/* =========================================================
   FIELD ID
========================================================= */

function fid(
  field
){

  return (
    "f_" +
    Array.from(field)
      .map(function(ch){

        return ch.charCodeAt(0);

      })
      .join("_")
  );

}


/* =========================================================
   OPEN MODAL
========================================================= */

async function openModal(
  row
){

  currentRow =
    row || null;

  /*
   * Dropdowns are loaded only when a form
   * is actually opened. This keeps module
   * switching fast.
   */

  loading(true);

  try{

    await loadDropdowns();

    const existing =
      row
        ? records.find(function(x){

            return (
              Number(x._row) ===
              Number(row)
            );

          }) || {}
        : {};

    let fields =
      HEADERS[currentModule];

    if(!fields){

      fields =
        records.length
          ? Object.keys(
              records[0]
            )
            .filter(function(k){

              return (
                k !== "_row"
              );

            })
          : [];

    }

    let html =
      fields
        .map(function(field){

          return formField(
            field,
            existing[field]
          );

        })
        .join("");


    /* USERS PHOTO */

    if(
      currentModule ===
      "Users"
    ){

      html += `

        <div class="field">

          <label>
            Staff / User Photo
          </label>

          <input
            id="staffPhoto"
            type="file"
            accept="image/*"
            onchange="previewStaffPhoto(this)"
          >

          <small>
            Photo will be uploaded to Google Drive.
          </small>

          <img
            id="staffPhotoPreview"
            class="photo-preview"
            src="${
              normalizeDriveImage(
                existing.Photo ||
                ""
              )
            }"
            ${
              existing.Photo
                ? ""
                : "style='display:none'"
            }
            onerror="this.style.display='none'"
          >

        </div>

      `;

    }


    /* DOCUMENT UPLOAD */

    if(
      currentModule ===
      "Documents"
    ){

      html += `

        <div class="field">

          <label>
            Upload Document
          </label>

          <input
            id="documentFile"
            type="file"
          >

          <small>
            The selected file will be uploaded to Google Drive.
          </small>

        </div>

      `;

    }


    document
      .getElementById(
        "modalTitle"
      )
      .textContent =
      (
        row
          ? "Edit "
          : "Add "
      ) +
      (
        LABELS[currentModule] ||
        currentModule
      );


    document
      .getElementById("form")
      .innerHTML =
      html;


    setupEmployeeSync();

    setupDependentDropdowns();

    setupLeaveCalculation();


    document
      .getElementById("modal")
      .classList.add(
        "show"
      );

  }catch(error){

    toast(
      error.message
    );

  }finally{

    loading(false);

  }

}


/* =========================================================
   EMPLOYEE SYNC
========================================================= */

function setupEmployeeSync(){

  const idEl =
    document.getElementById(
      fid("Employee ID")
    );

  const nameEl =
    document.getElementById(
      fid("Employee Name")
    );

  if(
    !idEl ||
    !nameEl
  ){

    return;

  }

  idEl.addEventListener(
    "change",
    function(){

      syncEmployeeFromId();

    }
  );

  nameEl.addEventListener(
    "change",
    function(){

      syncEmployeeFromName();

    }
  );

  /*
   * If existing record has Employee ID,
   * populate the matching name.
   */

  if(
    idEl.value
  ){

    syncEmployeeFromId();

  }else if(
    nameEl.value
  ){

    syncEmployeeFromName();

  }

}


function getEmployees(){

  return (
    dropdowns &&
    (
      dropdowns.employees ||
      dropdowns.users
    )
  ) || [];

}


function employeeIdOf(
  employee
){

  return (
    employee["Employee ID"] ||
    employee.employeeId ||
    employee["User ID"] ||
    ""
  );

}


function employeeNameOf(
  employee
){

  return (
    employee["Full Name"] ||
    employee.Name ||
    employee.name ||
    ""
  );

}


function syncEmployeeFromId(){

  const idEl =
    document.getElementById(
      fid("Employee ID")
    );

  const nameEl =
    document.getElementById(
      fid("Employee Name")
    );

  if(
    !idEl ||
    !nameEl
  ){

    return;

  }

  const employee =
    getEmployees().find(
      function(x){

        return String(
          employeeIdOf(x)
        ) ===
        String(
          idEl.value
        );

      }
    );

  nameEl.value =
    employee
      ? employeeNameOf(employee)
      : "";

}


function syncEmployeeFromName(){

  const idEl =
    document.getElementById(
      fid("Employee ID")
    );

  const nameEl =
    document.getElementById(
      fid("Employee Name")
    );

  if(
    !idEl ||
    !nameEl
  ){

    return;

  }

  const employee =
    getEmployees().find(
      function(x){

        return String(
          employeeNameOf(x)
        ) ===
        String(
          nameEl.value
        );

      }
    );

  idEl.value =
    employee
      ? employeeIdOf(employee)
      : "";

}

   DEPENDENT DROPDOWNS
========================================================= */

function setupDependentDropdowns(){

  const country =
    document.getElementById(
      fid("Country")
    );

  const university =
    document.getElementById(
      fid("University")
    );

  const preferredCountry =
    document.getElementById(
      fid("Preferred Country")
    );

    document.getElementById(

    );

  if(country){

    country.addEventListener(

        filterUniversities(
          country.value,

        );

    );

  }

  if(preferredCountry){

    preferredCountry.addEventListener(
      "change",
      function(){

        filterUniversities(
          preferredCountry.value,
          "Preferred University"
        );

      }
    );

  }

  if(university){

    university.addEventListener(
      "change",
      function(){

        filterCourses(
          university.value,
          "Course"
        );

      }
    );

  }

  if(preferredUniversity){

    preferredUniversity.addEventListener(
      "change",
      function(){

        filterCourses(
          preferredUniversity.value,
          "Preferred Course"
        );

      }
    );

  }

}


function filterUniversities(
  country,
  field
){

  const el =
    document.getElementById(
      fid(field)
    );

  if(
    !el ||
    !dropdowns
  ){

    return;

  }

  const list =
    (
      dropdowns.universities ||
      []
    )
    .filter(function(x){

      return (
        !country ||
        String(
          x.Country ||
          ""
        ) ===
        String(country)
      );

    });

  const old =
    el.value;

  el.innerHTML =
    `<option value="">Select...</option>` +
    list
      .map(function(x){

        const name =
          x["University Name"] ||
          x.University ||
          "";

        return `

          <option
            value="${esc(name)}"
          >
            ${esc(name)}
          </option>

        `;

      })
      .join("");

  if(
    old &&
    list.some(function(x){

      return String(
        x["University Name"] ||
        x.University ||
        ""
      ) ===
      String(old);

    })
  ){

    el.value =
      old;

  }

}


function filterCourses(
  university,
  field
){

  const el =
    document.getElementById(
      fid(field)
    );

  if(
    !el ||
    !dropdowns
  ){

    return;

  }

  const list =
    (
      dropdowns.courses ||
      []
    )
    .filter(function(x){

      return (
        !university ||
        String(
          x["University Name"] ||
          x.University ||
          ""
        ) ===
        String(university)
      );

    });

  const old =
    el.value;

  el.innerHTML =
    `<option value="">Select...</option>` +
    list
      .map(function(x){

        const name =
          x["Course Name"] ||
          x.Course ||
          "";

        return `

          <option
            value="${esc(name)}"
          >
            ${esc(name)}
          </option>

        `;

      })
      .join("");

  if(
    old &&
    list.some(function(x){

      return String(
        x["Course Name"] ||
        x.Course ||
        ""
      ) ===
      String(old);

    })
  ){

    el.value =
      old;

  }

}

/* =========================================================
   LEAVE DAYS
========================================================= */

function setupLeaveCalculation(){

  if(
    currentModule !==
    "LeaveManagement"
  ){

    return;

  }

  const start =
    document.getElementById(
      fid("Start Date")
    );

  const end =
    document.getElementById(
      fid("End Date")
    );

  if(start){

    start.addEventListener(
      "change",
      calculateLeaveDays
    );

  }

  if(end){

    end.addEventListener(
      "change",
      calculateLeaveDays
    );

  }

  calculateLeaveDays();

}


function calculateLeaveDays(){

  const start =
    document.getElementById(
      fid("Start Date")
    );

  const end =
    document.getElementById(
      fid("End Date")
    );

  const total =
    document.getElementById(
      fid("Total Days")
    );

  if(
    !start ||
    !end ||
    !total
  ){

    return;

  }

  if(
    !start.value ||
    !end.value
  ){

    total.value = "";
    return;

  }

  const s =
    new Date(
      start.value +
      "T00:00:00"
    );

  const e =
    new Date(
      end.value +
      "T00:00:00"
    );

  if(
    e < s
  ){

    total.value = "";
    return;

  }

  total.value =
    Math.round(
      (
        e - s
      ) /
      86400000
    ) + 1;

}


/* =========================================================
   SAVE RECORD
========================================================= */

async function saveRecord(){

  const fields =
    HEADERS[currentModule] ||
    [];

  const record = {};

  fields.forEach(function(field){

    const element =
      document.getElementById(
        fid(field)
      );

    if(element){

      record[field] =
        element.value;

    }

  });


  if(
    currentRow
  ){

    record._row =
      currentRow;

  }


  /* USERS */

  if(
    currentModule ===
    "Users"
  ){

    const password =
      document.getElementById(
        fid("Password")
      );

    if(
      password
    ){

      record.Password =
        password.value;

    }

  }


  /* EMPLOYEE VALIDATION */

  if(
    record["Employee ID"] ||
    record["Employee Name"]
  ){

    if(
      !record["Employee ID"]
    ){

      toast(
        "Please select Employee ID."
      );

      return;

    }

    if(
      !record["Employee Name"]
    ){

      toast(
        "Please select Employee Name."
      );

      return;

    }

  }


  /* DOCUMENT */

  if(
    currentModule ===
    "Documents"
  ){

    const file =
      document.getElementById(
        "documentFile"
      );

    if(
      file &&
      file.files &&
      file.files.length
    ){

      await uploadDocumentAndSave(
        record,
        file.files[0]
      );

      return;

    }

  }


  /* STAFF PHOTO */

  if(
    currentModule ===
    "Users"
  ){

    const photo =
      document.getElementById(
        "staffPhoto"
      );

    if(
      photo &&
      photo.files &&
      photo.files.length
    ){

      await uploadStaffPhotoAndSave(
        record,
        photo.files[0]
      );

      return;

    }

  }


  await saveRecordDirect(
    record
  );

}


/* =========================================================
   DIRECT SAVE
========================================================= */

async function saveRecordDirect(
  record
){

  loading(true);

  try{

    const result =
      await api(
        "save",
        {
          module:
            currentModule,
          record
        }
      );

    if(!result.success){

      toast(
        result.message ||
        "Save failed."
      );

      return;

    }

    closeModal();

    clearCaches();

    await openModule(
      currentModule
    );

    toast(
      "Saved successfully."
    );

  }catch(error){

    toast(
      error.message
    );

  }finally{

    loading(false);

  }

}

   STAFF PHOTO
========================================================= */

function previewStaffPhoto(

){

      "staffPhotoPreview"
    );

  if(

    !input.files ||
    !input.files.length
  ){

    );

}


/* =========================================================
   STAFF PHOTO UPLOAD
========================================================= */

async function uploadStaffPhotoAndSave(
  record,
  file
){

  loading(true);

  try{

    const compressed =
      await compressImage(
        file,
        1200,
        0.82
      );

    const base64 =
      await toBase64(
        compressed
      );

    const upload =
      await api(
        "uploadStaffPhoto",
        {
          base64,
          fileName:
            file.name,
          mimeType:
            compressed.type ||
            "image/jpeg"
        }
      );

    if(
      !upload.success
    ){

      toast(
        upload.message ||
        "Photo upload failed."
      );

      return;

    }

    record.Photo =
      upload.url ||
      upload.viewUrl ||
      upload.fileUrl ||
      "";

    await saveRecordDirect(
      record
    );

  }catch(error){

    toast(
      error.message
    );

  }finally{

    loading(false);

  }

}


/* =========================================================
   DOCUMENT UPLOAD
========================================================= */

async function uploadDocumentAndSave(
  record,
  file
){

  loading(true);

  try{

    const base64 =
      await toBase64(
        file
      );

    const result =
      await api(
        "uploadDocument",
        {

          base64,

          fileName:
            file.name,

          mimeType:
            file.type,

          studentId:
            record["Student ID"] ||
            "",

          applicationId:
            record["Application ID"] ||
            "",

          documentType:
            record["Document Type"] ||
            "Other",

          expiryDate:
            record["Expiry Date"] ||
            "",

          notes:
            record.Notes ||
            ""

        }
      );

    if(
      !result.success
    ){

      toast(
        result.message ||
        "Document upload failed."
      );

      return;

    }

    record["File URL"] =
      result.url ||
      result.viewUrl ||
      result.fileUrl ||
      "";

    /*
     * If backend uploadDocument has already
     * created the Documents record, don't

     */

    ){

      clearCaches();

        "Documents"
      );

      );

    }

    await saveRecordDirect(
      record
    );

  }catch(error){

    toast(
      error.message
    );

    loading(false);

  }

}


/* =========================================================
   FILE HELPERS
========================================================= */

function toBase64(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const result =
            String(
              reader.result
            );

          resolve(
            result.split(",")[1]
          );

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


function compressImage(
  file,
  maxSize,
  quality
){

  return new Promise(
    function(resolve,reject){

      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        resolve(file);
        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const img =
            new Image();

          img.onload =
            function(){

              let width =
                img.width;

              let height =
                img.height;

              if(
                width > maxSize ||
                height > maxSize
              ){

                const ratio =
                  Math.min(
                    maxSize /
                      width,
                    maxSize /
                      height
                  );

                width =
                  Math.round(
                    width *
                    ratio
                  );

                height =
                  Math.round(
                    height *
                    ratio
                  );

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );

              canvas.toBlob(
                function(blob){

                  if(!blob){

                    reject(
                      new Error(
                        "Image compression failed."
                      )
                    );

                    return;

                  }

                  const compressed =
                    new File(
                      [blob],
                      file.name.replace(
                        /\.[^/.]+$/,
                        ""
                      ) +
                      ".jpg",
                      {
                        type:
                          "image/jpeg"
                      }
                    );

                  resolve(
                    compressed
                  );

                },
                "image/jpeg",
                quality
              );

            };

          img.onerror =
            reject;

          img.src =
            reader.result;

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =========================================================
   WHATSAPP
========================================================= */

function whatsapp(
  phone
){

  let number =
    String(
      phone ||
      ""
    )
    .replace(
      /\D/g,
      ""
    );

  if(
    number.startsWith("0")
  ){

    number =
      "880" +
      number.substring(1);

  }else if(
    !number.startsWith("880")
  ){

    number =
      "880" +
      number;

  }

  if(
    number.length < 11
  ){

    toast(
      "Invalid phone number."
    );

    return;

  }

  window.open(
    "https://wa.me/" +
    number,
    "_blank"
  );

}


/* =========================================================
   DRIVE IMAGE
========================================================= */

function normalizeDriveImage(
  url
){

  if(
    !url
  ){

    return "";

  }

  const text =
    String(url);

  const match =
    text.match(
      /[?&]id=([^&]+)/i
    );

  if(match){

    return (
      "https://drive.google.com/uc?export=view&id=" +
      match[1]
    );

  }

  const fileMatch =
    text.match(
      /\/d\/([^/]+)/
    );

  if(fileMatch){

    return (
      "https://drive.google.com/uc?export=view&id=" +
      fileMatch[1]
    );

  }

  return text;

}


/* =========================================================
   NORMALIZE DATE
========================================================= */

function normalizeDateValue(
  value
){

  if(
    !value
  ){

    return "";

  }

  const text =
    String(value);

  if(
    /^\d{4}-\d{2}-\d{2}$/
      .test(text)
  ){

    return text;

  }

  const d =
    new Date(value);

  if(
    isNaN(d.getTime())
  ){

    return text.substring(
      0,
      10
    );

  }

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth()+1
    )
    .padStart(
      2,
      "0"
    );

  const day =
    String(
      d.getDate()
    )
    .padStart(
      2,
      "0"
    );

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}
